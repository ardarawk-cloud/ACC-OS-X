  <style>
    html,body{margin:0;min-height:100%;background:#020617;color:#f8fafc}
    #boot{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#020617;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:opacity .18s ease}

    .boot-card{display:grid;place-items:center;gap:14px;text-align:center}
    .boot-card img{width:112px;height:112px;border-radius:26px;box-shadow:0 0 46px rgba(168,85,247,.25)}
    .boot-title{font-weight:800;letter-spacing:.12em}
    .boot-sub{font-size:12px;color:#8390aa}
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-card">
      <img src="./acc-os-x-192-build250.png" alt="ACC OS X">
      <div class="boot-title">ACC OS X</div>
      <div class="boot-sub">ACC CORE v1.0 • BUILD 250</div>
    </div>
  </div>
  <div id="root"></div>

  <script id="acc-build250-context-bridge">
  (() => {
    const STATE_KEY = "acc_os_x_ecosystem_v214";
    const nativeFetch = window.fetch.bind(window);

    const txt = v => typeof v === "string" ? v.trim() : "";
    const stageFromMessages = body => {
      const joined = (Array.isArray(body?.messages) ? body.messages : [])
        .map(m => txt(m?.content)).join("\n");
      const m = joined.match(/(?:^|\n)STAGE:\s*(RESEARCH|SCRIPT|POSTER|CAPTION|QC|PUBLISHING)\b/i);
      return m ? String(m[1] || "").toUpperCase() : "";
    };
    const readState = () => {
      try { return JSON.parse(localStorage.getItem(STATE_KEY) || "{}"); }
      catch { return {}; }
    };
    const latest = (assets, channelId, stage, mediaMode="any") =>
      assets.find(a => {
        if (a?.channelId !== channelId || String(a?.stage || "").toUpperCase() !== stage || !txt(a?.output)) return false;
        const media = Boolean(a?.mediaBase64 || a?.publicUrl || String(a?.type || "").toUpperCase() === "IMAGE");
        return mediaMode === "media" ? media : mediaMode === "text" ? !media : true;
      }) || null;

    const section = (raw, name, nextNames=[]) => {
      const stop = nextNames.join("|");
      const re = new RegExp(
        `^\\s*${name}\\s*:\\s*([\\s\\S]*?)${stop ? `(?=^\\s*(?:${stop})\\s*:|$)` : "$"}`,
        "im"
      );
      const m = String(raw || "").match(re);
      return m ? txt(m[1]) : "";
    };

    const compactResearch = raw => {
      const names = ["TOPIC","VERIFIED_FACTS","SOURCE_NOTES","ANGLE","KEY_POINTS","VISUAL_FACTS","RISK_NOTES","SOURCES"];
      const pieces = [];
      for (const name of names) {
        const value = section(raw, name, names.filter(x => x !== name));
        if (!value) continue;
        const cap =
          name === "VERIFIED_FACTS" ? 3600 :
          name === "KEY_POINTS" ? 1800 :
          name === "SOURCES" ? 1800 :
          name === "ANGLE" ? 900 :
          name === "TOPIC" ? 300 : 900;
        pieces.push(`${name}:\n${value.slice(0, cap)}`);
      }
      const pass = /^\s*RESEARCH_PASS\b/i.test(String(raw || "")) ? "RESEARCH_PASS\n" : "";
      return (pass + pieces.join("\n\n")).slice(0, 9200);
    };

    const compactText = (raw, max) => String(raw || "").trim().slice(0, max);

    const hydrateContext = body => {
      const stage = stageFromMessages(body);
      if (!stage || stage === "RESEARCH" || !body?.context?.profile?.id) return body;

      const persisted = readState();
      const assets = Array.isArray(persisted?.assets) ? persisted.assets : [];
      const channelId = body.context.profile.id;
      const incoming = Array.isArray(body.context.upstreamAssets) ? body.context.upstreamAssets : [];

      const r = latest(assets, channelId, "RESEARCH", "text");
      const s = latest(assets, channelId, "SCRIPT", "text");
      const c = latest(assets, channelId, "CAPTION", "text");
      const p = latest(assets, channelId, "POSTER", "text");

      const fullByStage = {
        RESEARCH: r ? compactResearch(r.output) : "",
        SCRIPT: s ? compactText(s.output, 5200) : "",
        CAPTION: c ? compactText(c.output, 1900) : "",
        POSTER: p ? compactText(p.output, 2600) : ""
      };

      const next = JSON.parse(JSON.stringify(body));
      const rows = Array.isArray(next.context.upstreamAssets) ? next.context.upstreamAssets : [];

      for (const row of rows) {
        const st = String(row?.stage || "").toUpperCase();
        if (!fullByStage[st]) continue;
        if (st === "POSTER" && row?.hasMedia) continue;
        row.output = fullByStage[st];
      }

      const ensureStage = (st, output) => {
        if (!output) return;
        if (rows.some(x => String(x?.stage || "").toUpperCase() === st && !(st === "POSTER" && x?.hasMedia))) return;
        rows.push({
          type: st, stage: st, title: `${st} Context Bridge`,
          createdAt: new Date().toISOString(), hasMedia: false,
          mimeType: null, output
        });
      };

      ensureStage("RESEARCH", fullByStage.RESEARCH);
      if (stage === "CAPTION" || stage === "QC" || stage === "PUBLISHING") ensureStage("SCRIPT", fullByStage.SCRIPT);
      if (stage === "QC" || stage === "PUBLISHING") {
        ensureStage("POSTER", fullByStage.POSTER);
        ensureStage("CAPTION", fullByStage.CAPTION);
      }

      next.context.upstreamAssets = rows.slice(0, 8);
      next.context.clientContextBridge = {
        revision: "BUILD250_CONTEXT_BRIDGE_V1",
        stage,
        restored: true
      };
      return next;
    };

    window.fetch = async (input, init={}) => {
      try {
        const url = typeof input === "string" ? input : input?.url || "";
        const method = String(init?.method || (typeof input !== "string" ? input?.method : "GET") || "GET").toUpperCase();

        if (method === "POST" && /\/api\/acc-ai(?:\?|$)/.test(url) && typeof init?.body === "string") {
          const body = JSON.parse(init.body);
          const hydrated = hydrateContext(body);
          if (hydrated !== body) init = {...init, body: JSON.stringify(hydrated)};
        }
      } catch {
      }
      return nativeFetch(input, init);
    };
  })();
  </script>

    }));
  </script>
