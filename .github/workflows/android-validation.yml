name: ACC OS X Android Validation

on:
  push:
    branches:
      - main
      - agent/acc-os-x-hybrid-pilot
    paths:
      - 'android/**'
      - 'ACC-OS-X-AUTHORITY.md'
      - 'scripts/verify-android-release-contract.sh'
      - '.github/workflows/android-validation.yml'
      - '.github/workflows/android-production-release.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android/**'
      - 'ACC-OS-X-AUTHORITY.md'
      - 'scripts/verify-android-release-contract.sh'
      - '.github/workflows/android-validation.yml'
      - '.github/workflows/android-production-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Android release contract
        shell: bash
        run: bash scripts/verify-android-release-contract.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore validation signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: acc-os-x-hybrid-pilot-debug-key-v1

      - name: Ensure validation signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=ACC OS X Validation,O=Arda Core Corporation,C=ID" -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate debug and release compilation
        working-directory: android
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Mark validation as internal only
        shell: bash
        run: |
          echo "Validation PASS."
          echo "No APK is published from this workflow."
          echo "Only android-production-release.yml may create a distributable ACC OS X update."
