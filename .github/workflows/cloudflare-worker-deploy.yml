name: ACC OS X Cloudflare Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - '*.js'
      - '*.html'
      - '*.json'
      - '*.webmanifest'
      - '.assetsignore'
      - 'assets/**'
      - 'wrangler.jsonc'
      - 'ACC-OS-X-AUTHORITY.md'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acc-os-x-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate canonical ACC OS X web runtime
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import pathlib
          import re

          src = pathlib.Path("assets/app-launcher/bali-wedding-dj.jpg.b64")
          dst = pathlib.Path("assets/app-launcher/bali-wedding-dj.jpg")
          raw = src.read_text(encoding="utf-8", errors="ignore")
          clean = "".join(re.findall(r"[A-Za-z0-9+/=]", raw))
          clean += "=" * ((-len(clean)) % 4)
          data = base64.b64decode(clean, validate=False)
          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Decoded Bali Wedding DJ asset is not JPEG")
          dst.write_bytes(data)
          print(f"Materialized {dst}: {len(data)} bytes")
          PY
          test -s assets/app-launcher/bali-wedding-dj.jpg

          for f in \
            app.js \
            desktop-mode-v1.js \
            home-launchpad.js \
            home-launcher-chain-v1.js \
            home-quick-access-v1.js \
            my-projects-launcher-v1.js \
            my-admin-launcher-v1.js \
            owner-app-launcher-v2.js \
            launcher-layout-stability-v1.js \
            service-worker.js \
            release-version-v257.js \
            produce-copilot-v2578.js \
            worker-brain-runtime-rescue-v9.js \
            worker-map-icon-proxy-v1.js \
            worker-produce-access-guard-v1.js \
            worker-roblox-publish-probe-v1.js; do
            node --check "$f"
          done

          grep -q 'const MOBILE_LIMIT = 4;' home-quick-access-v1.js
          grep -q 'const DESKTOP_LIMIT = 8;' home-quick-access-v1.js
          grep -q 'g-p-6ac8f1bfb7748191a4905d68ee1b0315-nadmo-live/project' my-projects-launcher-v1.js
          grep -q 'com.nadmo.papasaucelab","com.accbuilder.papasaucelab' home-launchpad.js
          grep -q 'BUILD257_8_PRODUCTION_PUBLISHING_STABLE_R2_ACCESS_RECOVERY' produce-copilot-v2578.js
          grep -q 'produce-copilot-v2578.js?rev=BUILD257_8_PRODUCTION_PUBLISHING_STABLE_R2_ACCESS_RECOVERY' release-version-v257.js
          grep -q 'BRAIN_RUNTIME_RESCUE_V9_1_HERO_IMAGE_PROMPT_LIMIT' worker-brain-runtime-rescue-v9.js
          grep -q 'PRODUCE_OWNER_ACCESS_GUARD_V1' worker-produce-access-guard-v1.js
          grep -q 'worker-produce-access-guard-v1.js' worker-roblox-publish-probe-v1.js
          grep -q 'KAI_ONE_ROBLOX_MAP_ICON_PROXY_V3_MOUNT_BBYA_CORRECT_PLACE' worker-map-icon-proxy-v1.js
          grep -q 'worker-roblox-publish-probe-v1.js' wrangler.jsonc
          grep -q 'KAI_ONE_OS_X_CANONICAL_2026_10_16' wrangler.jsonc

      - name: Build isolated ACC OS X static assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          root = Path(".")
          out = root / ".acc-os-x-public"
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          seeds = [
              "index.html",
              "service-worker.js",
              "app.js",
              "manifest.webmanifest",
              "version.json",
              "build-info.json",
              "build.json",
          ]
          allowed_ext = {"js","css","json","webmanifest","png","jpg","jpeg","svg","ico"}
          ref_re = re.compile(r'''["'\x60](?:\./)([A-Za-z0-9._/-]+\.(?:js|css|json|webmanifest|png|jpg|jpeg|svg|ico))(?:\?[^"'\x60]*)?["'\x60]''', re.I)

          queue = list(seeds)
          seen = set()
          while queue:
              rel = queue.pop(0)
              if rel in seen:
                  continue
              src = root / rel
              if not src.is_file():
                  raise SystemExit(f"Required runtime asset missing: {rel}")
              seen.add(rel)
              if src.suffix.lower().lstrip(".") in {"js","html","css"}:
                  text = src.read_text(encoding="utf-8", errors="ignore")
                  for match in ref_re.finditer(text):
                      child = match.group(1)
                      candidate = root / child
                      if candidate.is_file() and child not in seen:
                          queue.append(child)

          # Copy discovered runtime dependency closure.
          for rel in sorted(seen):
              src = root / rel
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          # Runtime artwork is public by design; project/source directories are not.
          if (root / "assets").is_dir():
              shutil.copytree(root / "assets", out / "assets", dirs_exist_ok=True)

          # Hard fail if internal project/infrastructure accidentally crosses the boundary.
          forbidden = [".github","android","apps","deploy-status","handoffs","nadmo-cloudflare","nadmo-cloudflare-src","scripts"]
          leaked = [name for name in forbidden if (out / name).exists()]
          if leaked:
              raise SystemExit("Forbidden directories in public asset staging: " + ", ".join(leaked))

          cfg = json.loads((root / "wrangler.jsonc").read_text(encoding="utf-8"))
          cfg["assets"]["directory"] = ".acc-os-x-public"
          (root / "wrangler.deploy.json").write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")

          print(f"Public runtime files: {len(seen)} + assets/")
          print("Public runtime closure:")
          for rel in sorted(seen):
              print(" -", rel)
          PY
          test -f .acc-os-x-public/home-quick-access-v1.js
          test -f .acc-os-x-public/my-projects-launcher-v1.js
          test -f .acc-os-x-public/home-launchpad.js
          test ! -e .acc-os-x-public/.github
          test ! -e .acc-os-x-public/android
          test ! -e .acc-os-x-public/nadmo-cloudflare

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy --config wrangler.deploy.json

      - name: Verify canonical production runtime
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          BASE_URL="${DEPLOYMENT_URL:-https://acc-os-x-baxkup.ardarawk.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          echo "Verifying: $BASE_URL"

          ok=0
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/health" || true)"
            printf '%s\n' "$BODY"
            if grep -Fq 'BRAIN_RUNTIME_RESCUE_V9_1_HERO_IMAGE_PROMPT_LIMIT' <<<"$BODY"; then
              ok=1
              break
            fi
            echo "V9 health marker not visible yet; waiting for edge propagation ($attempt/6)"
            sleep 5
          done
          test "$ok" = 1

          PRODUCE_HEALTH="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/api/produce-health")"
          grep -Fq '"produceAccessGuard":"ACTIVE"' <<<"$PRODUCE_HEALTH"
          grep -Fq '"aiBinding":true' <<<"$PRODUCE_HEALTH"
          grep -Fq '"accessSecretConfigured":true' <<<"$PRODUCE_HEALTH"

          QUICK="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/home-quick-access-v1.js")"
          PROJECTS="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/my-projects-launcher-v1.js")"
          HOME="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/home-launchpad.js")"
          INTERNAL="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/.github/workflows/runtime-validation.yml" || true)"

          grep -Fq 'const DESKTOP_LIMIT = 8;' <<<"$QUICK"
          grep -Fq 'g-p-6ac8f1bfb7748191a4905d68ee1b0315-nadmo-live/project' <<<"$PROJECTS"
          grep -Fq 'com.nadmo.papasaucelab","com.accbuilder.papasaucelab' <<<"$HOME"

          produce_ok=0
          for attempt in 1 2 3 4 5 6; do
            PRODUCE_JS="$(curl --fail --silent --show-error --max-time 30 "$BASE_URL/produce-copilot-v2578.js?rev=BUILD257_8_PRODUCTION_PUBLISHING_STABLE_R2_ACCESS_RECOVERY&t=$attempt" || true)"
            if grep -Fq 'BUILD257_8_PRODUCTION_PUBLISHING_STABLE_R2_ACCESS_RECOVERY' <<<"$PRODUCE_JS" && grep -Fq 'AI ACCESS lama ditolak dan sudah direset' <<<"$PRODUCE_JS"; then
              produce_ok=1
              break
            fi
            echo "Fresh Produce asset not visible yet; waiting for edge propagation ($attempt/6)"
            sleep 5
          done
          test "$produce_ok" = 1
          if grep -Fq 'name: ACC OS X Runtime Validation' <<<"$INTERNAL"; then
            echo "::error::Internal GitHub workflow is still exposed as a public Worker asset."
            exit 1
          fi
          echo "Canonical ACC OS X live runtime verified; internal project files are outside the public asset boundary."
