name: ACC OS X Cloudflare Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'worker-*.js'
      - 'produce-copilot-publish-queue-v1.js'
      - 'production-contracts-v1.js'
      - 'division-passports-v1.js'
      - 'owner-*.js'
      - 'my-*.js'
      - 'service-worker.js'
      - 'legacy-launcher-accordion-v1.js'
      - 'bali-wedding-dj-launcher-v1.js'
      - 'sync-cctv-launcher-v1.js'
      - 'publishing-page-aliases-v1.js'
      - 'publishing-mobile-page-picker-v1.js'
      - 'publishing-instagram-bridge-v1.js'
      - 'publishing-instagram-observer-guard-v1.js'
      - 'assets/app-icons/**'
      - 'assets/app-launcher/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acc-os-x-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize required launcher images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import pathlib
          import re

          src = pathlib.Path("assets/app-launcher/bali-wedding-dj.jpg.b64")
          dst = pathlib.Path("assets/app-launcher/bali-wedding-dj.jpg")
          raw = src.read_text(encoding="utf-8", errors="ignore")
          clean = "".join(re.findall(r"[A-Za-z0-9+/=]", raw))
          clean += "=" * ((-len(clean)) % 4)
          data = base64.b64decode(clean, validate=False)
          if not data.startswith(b"\xff\xd8\xff"):
              raise SystemExit("Decoded Bali Wedding DJ asset is not JPEG")
          dst.write_bytes(data)
          print(f"Materialized {dst}: {len(data)} bytes")
          PY
          test -s assets/app-launcher/bali-wedding-dj.jpg
          grep -q 'KAI_ONE_MY_MAPS_V17_ROBLOX_ICON_PROXY' my-maps-launcher-v1.js
          grep -q 'KAI_ONE_ROBLOX_MAP_ICON_PROXY_V1' worker-map-icon-proxy-v1.js
          grep -q 'acc-os-x-maps-v17-roblox-icon-proxy' service-worker.js
          grep -q 'worker-map-icon-proxy-v1.js' wrangler.jsonc
          grep -q 'KAI_ONE_INSTAGRAM_BRIDGE_V2_SAFE_FALLBACK' publishing-instagram-bridge-v1.js
          grep -q 'KAI_ONE_INSTAGRAM_BRIDGE_V2_SAFE_FALLBACK' publishing-page-aliases-v1.js
          grep -q 'KAI_ONE_INSTAGRAM_DIRECT_TOUCH_V3' publishing-instagram-observer-guard-v1.js

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy

      - name: Verify V8 health marker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Deployment URL: ${DEPLOYMENT_URL:-<empty>}"
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "::warning::Wrangler did not expose a deployment URL; deploy itself succeeded."
            exit 0
          fi
          HEALTH_URL="${DEPLOYMENT_URL%/}/health"
          echo "Checking $HEALTH_URL"
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 30 "$HEALTH_URL" || true)"
            printf '%s\n' "$BODY"
            if printf '%s' "$BODY" | grep -q 'BRAIN_RUNTIME_RESCUE_V8_CAPTION_NULL_SERIES_GUARD'; then
              echo "V8 health marker confirmed on attempt $attempt"
              exit 0
            fi
            echo "V8 marker not visible yet; waiting for edge propagation ($attempt/6)"
            sleep 5
          done
          echo "::error::V8 health marker not visible after propagation wait"
          exit 1
