name: ACC OS X Cloudflare Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'worker-*.js'
      - 'produce-copilot-publish-queue-v1.js'
      - 'production-contracts-v1.js'
      - 'division-passports-v1.js'
      - 'owner-*.js'
      - 'my-*.js'
      - 'service-worker.js'
      - 'legacy-launcher-accordion-v1.js'
      - 'bali-wedding-dj-launcher-v1.js'
      - 'sync-cctv-launcher-v1.js'
      - 'publishing-page-aliases-v1.js'
      - 'publishing-mobile-page-picker-v1.js'
      - 'publishing-instagram-bridge-v1.js'
      - 'publishing-instagram-observer-guard-v1.js'
      - 'assets/app-icons/**'
      - 'assets/app-launcher/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cloudflare-worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acc-os-x-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialize local launcher images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          import io
          import pathlib
          import re
          from PIL import Image

          pairs = [
              ("assets/app-icons/my-maps-icons-sprite.jpg.b64", "assets/app-icons/my-maps-icons-sprite.jpg"),
              ("assets/app-launcher/bali-wedding-dj.jpg.b64", "assets/app-launcher/bali-wedding-dj.jpg"),
          ]
          clean_by_src = {}
          data_by_src = {}
          for src, dst in pairs:
              raw = pathlib.Path(src).read_text(encoding="utf-8", errors="ignore")
              clean = "".join(re.findall(r"[A-Za-z0-9+/=]", raw))
              clean += "=" * ((-len(clean)) % 4)
              data = base64.b64decode(clean, validate=False)
              if not data.startswith(b"\xff\xd8\xff"):
                  raise SystemExit(f"Decoded asset is not JPEG: {src}")
              pathlib.Path(dst).write_bytes(data)
              clean_by_src[src] = clean
              data_by_src[src] = data
              print(f"Materialized {dst}: {len(data)} bytes")

          sprite_data = data_by_src["assets/app-icons/my-maps-icons-sprite.jpg.b64"]
          with Image.open(io.BytesIO(sprite_data)) as sprite:
              sprite = sprite.convert("RGB")
              width, height = sprite.size
              if width % 4 or height % 2:
                  raise SystemExit(f"Unexpected MY MAPS sprite dimensions: {width}x{height}")
              tile_w, tile_h = width // 4, height // 2
              names = [
                  "bbya-social-hub.jpg",
                  "zona-perang.jpg",
                  "after-school-city.jpg",
                  "becak-e-bike.jpg",
                  "wonderpocket.jpg",
                  "track-01.jpg",
                  "gunung-bbya.jpg",
                  "lost-found-night-shift.jpg",
              ]
              out_dir = pathlib.Path("assets/app-icons/my-maps")
              out_dir.mkdir(parents=True, exist_ok=True)
              for index, name in enumerate(names):
                  col, row = index % 4, index // 4
                  crop = sprite.crop((col * tile_w, row * tile_h, (col + 1) * tile_w, (row + 1) * tile_h))
                  out = out_dir / name
                  crop.save(out, format="JPEG", quality=95, optimize=True)
                  print(f"Materialized {out}: {crop.size[0]}x{crop.size[1]}")

          sprite_b64 = clean_by_src["assets/app-icons/my-maps-icons-sprite.jpg.b64"]
          sprite_js = (
              "// Generated during Cloudflare deploy — KAI ONE MY MAPS V8 legacy fallback\n"
              "window.ACCMyMapsSpriteDataUrl = \"data:image/jpeg;base64," + sprite_b64 + "\";\n"
          )
          pathlib.Path("my-maps-sprite-data-v1.js").write_text(sprite_js, encoding="utf-8")
          print(f"Materialized my-maps-sprite-data-v1.js: {len(sprite_js)} chars")
          PY
          test -s assets/app-icons/my-maps-icons-sprite.jpg
          test -s assets/app-launcher/bali-wedding-dj.jpg
          test -s my-maps-sprite-data-v1.js
          for logo in bbya-social-hub zona-perang after-school-city becak-e-bike wonderpocket track-01 gunung-bbya lost-found-night-shift; do
            test -s "assets/app-icons/my-maps/${logo}.jpg"
          done
          grep -q 'KAI_ONE_MY_MAPS_V16_INDIVIDUAL_FILES' my-maps-launcher-v1.js
          grep -q 'KAI_ONE_INSTAGRAM_BRIDGE_V2_SAFE_FALLBACK' publishing-instagram-bridge-v1.js
          grep -q 'KAI_ONE_INSTAGRAM_BRIDGE_V2_SAFE_FALLBACK' publishing-page-aliases-v1.js
          grep -q 'KAI_ONE_INSTAGRAM_DIRECT_TOUCH_V3' publishing-instagram-observer-guard-v1.js
          grep -q 'acc-os-x-maps-v16-individual-files' service-worker.js

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy

      - name: Verify V8 health marker
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Deployment URL: ${DEPLOYMENT_URL:-<empty>}"
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "::warning::Wrangler did not expose a deployment URL; deploy itself succeeded."
            exit 0
          fi
          HEALTH_URL="${DEPLOYMENT_URL%/}/health"
          echo "Checking $HEALTH_URL"
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 30 "$HEALTH_URL" || true)"
            printf '%s\n' "$BODY"
            if printf '%s' "$BODY" | grep -q 'BRAIN_RUNTIME_RESCUE_V8_CAPTION_NULL_SERIES_GUARD'; then
              echo "V8 health marker confirmed on attempt $attempt"
              exit 0
            fi
            echo "V8 marker not visible yet; waiting for edge propagation ($attempt/6)"
            sleep 5
          done
          echo "::error::V8 health marker not visible after propagation wait"
          exit 1
