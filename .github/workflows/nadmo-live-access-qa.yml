name: NADMO LIVE Dynamic Access E2E
on:
  workflow_dispatch:
  push:
    branches: ['feat/nadmo-live-beta-worker-20261009']
    paths:
      - 'nadmo-live-beta/qa/dynamic-access-smoke.cjs'
      - '.github/workflows/nadmo-live-access-qa.yml'
      - 'nadmo-live-beta/worker.mjs'
      - 'nadmo-live-beta/public/app/index.html'
permissions: {contents: read}
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install WebSocket test library
        run: npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund ws@8
      - name: Test custom-price, private switching and public restore
        run: node nadmo-live-beta/qa/dynamic-access-smoke.cjs
