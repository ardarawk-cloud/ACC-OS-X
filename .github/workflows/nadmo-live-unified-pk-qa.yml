name: NADMO LIVE unified PK safety and syntax QC
on:
  push:
    branches:
      - feat/nadmo-live-unified-stage-pk-20261012
    paths:
      - 'nadmo-live-beta/worker.mjs'
      - 'nadmo-live-beta/pk-battle.mjs'
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/qa/pk-battle-unit.mjs'
      - '.github/workflows/nadmo-live-unified-pk-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pk-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check Cloudflare worker and PK library syntax
        run: |
          node --check nadmo-live-beta/worker.mjs
          node --check nadmo-live-beta/pk-battle.mjs
      - name: Validate PK state and anti-fake-payment assertions
        run: node nadmo-live-beta/qa/pk-battle-unit.mjs
      - name: Parse embedded web client and check UI boundaries
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const html=fs.readFileSync('nadmo-live-beta/public/app/index.html','utf8');
          const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
          assert.ok(scripts.length>0,'Expected embedded frontend script');
          const client=scripts.join('\n');
          fs.writeFileSync('/tmp/nadmo-inline-client.js',client);
          for(const id of ['pkBattleHud','pkSettings','pkGuestInvite','pkCheerA','pkCheerB','pkInvite','pkEnd','pkAccept']){
            assert.ok(html.includes('id="'+id+'"'),id+' is missing');
          }
          assert.match(html,/function pkPaint\(/);
          assert.match(client,/type:'pk-consent'/);
          assert.match(client,/type:'pk-support'/);
          assert.match(html,/Pembayaran belum aktif/);
          const worker=fs.readFileSync('nadmo-live-beta/worker.mjs','utf8');
          assert.match(worker,/validHostSession\(s,room\)/);
          assert.match(worker,/getAccountBySessionFingerprint/);
          assert.match(worker,/type==='pk-start'/);
          assert.match(worker,/type==='pk-support'/);
          console.log('UI event contract and payment gating PASS');
          NODE
          node --check /tmp/nadmo-inline-client.js
      - name: Preserve existing duration and privacy contracts
        run: node nadmo-live-beta/qa/live-hourly-duration-contract.cjs
