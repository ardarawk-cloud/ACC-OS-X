name: NADMO LIVE Fullscreen UX QA
on:
  workflow_dispatch:
  push:
    branches: ['feat/nadmo-live-beta-worker-20261009']
    paths:
      - 'nadmo-live-beta/public/app/index.html'
      - '.github/workflows/nadmo-live-research-v05-qa.yml'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check UI script parse and actual controls
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const html=fs.readFileSync('nadmo-live-beta/public/app/index.html','utf8');
          const script=html.split('<script>')[1]?.split('</script>')[0];
          assert(script,'inline runtime JS exists');
          new Function(script);
          console.log('PASS JavaScript syntax');
          const ids=['explore','following','signal','studio','settings','rooms','searchLive','filters','savedRooms','afkToggle','hostControls','shareRoom','restartRoom','signalStatus','watchState','saveServer','serverState','adult','remote','camera','chat'];
          for(const id of ids)assert(html.includes('id="'+id+'"'),'missing '+id);
          console.log('PASS '+ids.length+' essential controls');
          assert(script.includes("show('explore')"),'default live first');
          assert(script.includes('canvas.captureStream'),'standby and talk audio visual scene');
          assert(script.includes('replaceTrack(track)'),'AFK swaps outgoing video');
          assert(script.includes('localStorage.setItem'),'following bookmarks');
          assert(html.includes('AUTO-CONNECT / ACTIVE'),'server auto-config');
          assert(!html.includes('BACKEND HTTPS ENDPOINT'),'no manual input');
          assert(html.includes('body.live-immersive #watch'),'immersive full viewport');
          assert(html.includes('class="panel live-chat"'),'overlay chat');
          assert(html.includes('id="modeDetails"'),'mode info');
          assert(html.includes('id="liveModeGrid"'),'broadcast modes');
          assert(!html.includes('id="privateId"')&&!html.includes('id="privateJoin"'),'obsolete manual private join form removed');
          assert(script.includes("get('room')")&&script.includes("get('private')"),'private invite deeplink still supported');
          assert(html.includes('id="accessQuick"')&&html.includes('id="tipQuick"'),'floating actions');
          console.log('PASS fullscreen UI, modes, bottom sheets, camera standby, following, private room');
          NODE
      - name: Verify HTML local rendering in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "Chrome not installed";exit 1;fi
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --window-size=420,950 --virtual-time-budget=2500 \
            --dump-dom "file://$GITHUB_WORKSPACE/nadmo-live-beta/public/app/index.html" > /tmp/nadmo-dom.html
          grep -q 'LIVE FEED' /tmp/nadmo-dom.html
          grep -q 'GO LIVE' /tmp/nadmo-dom.html
          echo 'PASS mobile rendering shell'
      - name: Verify HTTPS deployed page
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nadmo-live-beta-20261009.ardarawk.workers.dev/app/'
          for i in {1..6}; do
            curl -fsS --max-time 15 "$URL" -o /tmp/remote.html || true
            if grep -q 'live-immersive #watch' /tmp/remote.html && grep -q 'id="liveModeGrid"' /tmp/remote.html && grep -q 'class="panel live-chat"' /tmp/remote.html;then
              echo 'PASS remote full-screen live, mode picker and overlay chat';exit 0
            fi
            sleep 7
          done
          echo 'FAIL remote fullscreen live UI did not appear within propagation window';exit 1
