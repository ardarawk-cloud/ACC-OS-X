name: NADMO LIVE owner BETA RADIO live.nadmo.id deployment
on:
  push:
    branches: ['feat/nadmo-live-unified-stage-pk-20261012']
    paths: ['.github/workflows/nadmo-live-owner-beta-radio-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nadmo-live-beta-owner-radio-rollout
  cancel-in-progress: false
jobs:
  owner-beta-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static server and front-end syntax
        run: |
          node --check nadmo-live-beta/worker.mjs
          node --check nadmo-live-beta/pk-battle.mjs
          node nadmo-live-beta/qa/pk-battle-unit.mjs
          node nadmo-live-beta/qa/pk-room-websocket-e2e.mjs
          node nadmo-live-beta/qa/live-hourly-duration-contract.cjs
      - name: Validate intended OPEN MUSIC version, privacy and old-APK gate
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const html=fs.readFileSync('nadmo-live-beta/public/app/index.html','utf8');
          const worker=fs.readFileSync('nadmo-live-beta/worker.mjs','utf8');
          assert.match(html,/id="radioOpenMusic"/);
          assert.match(html,/radioMusicSupported===true/);
          assert.match(html,/watch-radio #watch \.live-stage/);
          assert.match(html,/id="radioLiveCanvas"/);
          assert.match(worker,/broadcastKind:room\.broadcastKind/);
          for(const [,js] of html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi))
            if(js.trim())new vm.Script(js);
          console.log('Radio CAMERA stage, capability gate, Worker kind, JS syntax PASS');
          NODE
      - name: Deploy existing NADMO LIVE beta Worker and app
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: nadmo-live-beta
          command: deploy --config wrangler.json
      - name: Check real live.nadmo.id beta UI and API
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5;do
            if curl -fLsS --max-time 20 https://live.nadmo.id/app/ -o /tmp/nadmo-live-radio-beta.html && \
               grep -Fq 'id="radioOpenMusic"' /tmp/nadmo-live-radio-beta.html && \
               grep -Fq 'id="radioLiveCanvas"' /tmp/nadmo-live-radio-beta.html && \
               curl -fLsS --max-time 20 https://live.nadmo.id/health | grep -Fq '"service":"nadmo-live-beta"';then
              echo "RADIO OPEN MUSIC WEB BETA DEPLOYED"
              exit 0
            fi
            sleep 5
          done
          echo "RADIO beta UI not verified on live.nadmo.id"
          exit 1
