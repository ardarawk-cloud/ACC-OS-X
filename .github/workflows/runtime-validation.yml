name: ACC OS X Runtime Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'index.html'
      - 'home-launchpad.js'
      - 'home-launcher-chain-v1.js'
      - 'owner-phone-launcher-v1.js'
      - 'desktop-mode-v1.js'
      - 'manifest.webmanifest'
      - 'produce-copilot-v2576.js'
      - 'produce-copilot-v2577.js'
      - 'produce-copilot-v2578.js'
      - 'produce-copilot-preview-fix-v25762.js'
      - 'produce-copilot-brain-firewall-v1.js'
      - 'produce-copilot-batch-runtime-v2.js'
      - 'produce-copilot-batch-runtime-v3.js'
      - 'produce-copilot-publish-queue-v1.js'
      - 'produce-copilot-publish-queue-v2.js'
      - 'produce-copilot-contract-guard-v259.js'
      - 'produce-copilot-busy-watchdog-v1.js'
      - 'native-scroll-performance-v1.js'
      - 'native-scroll-performance-v2.js'
      - 'release-version-v257.js'
      - 'release-version-v258.js'
      - 'service-worker.js'
      - 'worker-brain-isolation-runtime-v1.js'
      - 'worker-brain-runtime-rescue-v1.js'
      - 'worker-brain-runtime-rescue-v2.js'
      - 'worker-brain-runtime-rescue-v3.js'
      - 'worker-brain-runtime-rescue-v4.js'
      - 'worker-brain-runtime-rescue-v5.js'
      - 'worker-brain-runtime-rescue-v6.js'
      - 'worker-brain-runtime-rescue-v7.js'
      - 'worker-brain-runtime-rescue-v8.js'
      - 'worker-brain-runtime-rescue-v9.js'
      - 'worker-channel-master-authority-v1.js'
      - 'worker-contract-router-v258.js'
      - 'worker-contract-router-v259.js'
      - 'worker-build2577-entry.js'
      - 'worker-division-passport-runtime-v1.js'
      - 'worker-division-passport-runtime-v1-r4.js'
      - 'worker-poster-resilience-v258.js'
      - 'worker-copilot-master-runtime-v2577.js'
      - 'wrangler.jsonc'
      - '.github/workflows/runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate browser runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check home-launchpad.js
          node --check home-launcher-chain-v1.js
          node --check owner-phone-launcher-v1.js
          node --check desktop-mode-v1.js
          node --check produce-copilot-v2576.js
          node --check produce-copilot-v2577.js
          node --check produce-copilot-v2578.js
          node --check produce-copilot-preview-fix-v25762.js
          node --check produce-copilot-brain-firewall-v1.js
          node --check produce-copilot-batch-runtime-v2.js
          node --check produce-copilot-batch-runtime-v3.js
          node --check produce-copilot-publish-queue-v1.js
          node --check produce-copilot-publish-queue-v2.js
          node --input-type=module --check < produce-copilot-contract-guard-v259.js
          node --check produce-copilot-busy-watchdog-v1.js
          node --check native-scroll-performance-v1.js
          node --check native-scroll-performance-v2.js
          node --check release-version-v257.js
          node --check release-version-v258.js
          node --check service-worker.js

      - name: Validate canonical HOME launcher chain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'home-launcher-chain-v1.js?rev=KAI_ONE_HOME_LAUNCHER_CHAIN_V1' index.html
          grep -q 'home-launcher-chain-v1.js?rev=KAI_ONE_HOME_LAUNCHER_CHAIN_V1' service-worker.js
          grep -q 'owner-phone-launcher-v1.js?rev=KAI_ONE_OWNER_PHONE_LAUNCHER_V3_FAST_TAP_BUILD10' service-worker.js
          grep -q 'KAI_ONE_HOME_LAUNCHER_CHAIN_V1' home-launcher-chain-v1.js
          grep -q 'my-maps-launcher-v1.js?rev=KAI_ONE_MY_MAPS_V18_MOUNT_BBYA_CORRECT_PLACE' home-launcher-chain-v1.js
          grep -q 'my-projects-launcher-v1.js?rev=KAI_ONE_MY_PROJECTS_V4_APK_PROJECT' home-launcher-chain-v1.js
          grep -q 'my-admin-launcher-v1.js?rev=KAI_ONE_MY_ADMIN_V3_BWD_OWNER_PACKAGE' home-launcher-chain-v1.js
          grep -q 'launcher-layout-stability-v1.js?rev=KAI_ONE_LAUNCHER_LAYOUT_STABILITY_V6_BWD_ADMIN_OWNER' home-launcher-chain-v1.js
          grep -q 'window.ACCHomeLaunchpad=Object.freeze' home-launchpad.js
          grep -q 'window.addEventListener("acc-core-rendered"' home-launchpad.js
          if grep -q 'document.getElementById(LAUNCHPAD_ID)?.remove()' home-launchpad.js; then
            echo 'FAIL: MY APPS anchor is still destroyed during HOME refresh.' >&2
            exit 1
          fi
          if grep -q 'owner-app-launcher-v2.js' home-launcher-chain-v1.js; then
            echo 'FAIL: desktop-aware MY APPS must not be overwritten by legacy owner-app launcher.' >&2
            exit 1
          fi
          echo 'HOME launcher chain OK: APPS -> MAPS -> PROJECTS -> ADMIN -> native phone categories.'

      - name: Validate desktop mode contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'desktop-mode-v1.js?rev=KAI_ONE_DESKTOP_MODE_V1' index.html
          grep -q 'desktop-mode-v1.js?rev=KAI_ONE_DESKTOP_MODE_V1' service-worker.js
          grep -q 'KAI_ONE_DESKTOP_MODE_V1' desktop-mode-v1.js
          grep -q 'PC_READY' home-launchpad.js
          grep -q 'ANDROID_ONLY' home-launchpad.js
          grep -q 'window.ACCPlatform' desktop-mode-v1.js
          grep -q 'const isDesktop = () =>' home-launchpad.js
          grep -q 'ACCOSX(?:Native|Android)' home-launchpad.js
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('home-launchpad.js','utf8');
          const uses=(src.match(/\bisDesktop\s*\(/g)||[]).length;
          const defs=(src.match(/const\s+isDesktop\s*=/g)||[]).length;
          if(!defs || !uses) throw new Error('home-launchpad desktop helper contract missing');
          console.log('home-launchpad desktop helper OK', {defs,uses});
          NODE
          if grep -Eqi 'android emulator|bluestacks|waydroid' desktop-mode-v1.js home-launchpad.js; then
            echo 'FAIL: desktop mode must not depend on Android emulation.' >&2
            exit 1
          fi
          python - <<'PY'
          import json
          data=json.load(open('manifest.webmanifest'))
          assert data.get('display') == 'standalone'
          assert data.get('orientation') == 'any'
          override=data.get('display_override') or []
          assert 'standalone' in override
          print('Desktop PWA manifest OK')
          PY
          echo 'Desktop mode OK: web/PWA apps are PC-ready; APK-only apps are explicitly Android-only.'

      - name: Validate production and publishing stabilization
        shell: bash
        run: |
          set -euo pipefail

          # Active client authority must be v2578 only.
          grep -q 'BUILD257_8_PRODUCTION_PUBLISHING_STABLE' produce-copilot-v2578.js
          grep -q 'produce-copilot-v2578.js?rev=BUILD257_8_PRODUCTION_PUBLISHING_STABLE' release-version-v257.js
          grep -q 'produce-copilot-v2578.js?rev=BUILD257_8_PRODUCTION_PUBLISHING_STABLE' service-worker.js
          if grep -Eq 'produce-copilot-v257[67]\.js\?rev=' release-version-v257.js release-version-v258.js service-worker.js; then
            echo 'FAIL: legacy Produce v2576/v2577 is still active.' >&2
            exit 1
          fi
          grep -q 'BUILD258_IDENTITY_ONLY_PRODUCE_V2578_AUTHORITY' release-version-v258.js

          # Single + batch packaging and durable media.
          grep -q 'MEDIA_DB_NAME = "acc-os-x-produce-media-v1"' produce-copilot-v2578.js
          grep -q 'poster_batch' produce-copilot-v2578.js
          grep -q 'caption_batch' produce-copilot-v2578.js
          grep -q 'publishBatchItem' produce-copilot-v2578.js
          grep -q 'SINGLE_OR_PER_ITEM' produce-copilot-v2578.js
          grep -q 'PUBLISH_RESPONSE_MISSING_POST_ID' produce-copilot-v2578.js
          grep -q 'acc-publish-connectorv2.ardarawk.workers.dev/api/acc-publish' produce-copilot-v2578.js
          grep -q 'idempotencyKey' produce-copilot-v2578.js

          # Poster bytes must not remain in localStorage payloads.
          grep -q 'delete row.package.posterBase64' produce-copilot-v2578.js
          grep -q 'delete row.package.posterDataUrl' produce-copilot-v2578.js
          grep -q 'mediaPut' produce-copilot-v2578.js
          grep -q 'mediaGet' produce-copilot-v2578.js

          # No competing batch/queue authority from the Worker bootstrap.
          grep -q 'BUILD257_7_ENTRY_WRAPPER_R7_CONSOLIDATED_PUBLISH' worker-build2577-entry.js
          grep -q 'batchRuntime:"CONSOLIDATED_CLIENT_V2578"' worker-build2577-entry.js
          grep -q 'publishMode:"SINGLE_OR_PER_ITEM"' worker-build2577-entry.js
          grep -q 'publishApi:"ACTIVE"' worker-build2577-entry.js
          if grep -Eq 's\.src="\./produce-copilot-(batch-runtime-v3|publish-queue-v2)\.js' worker-build2577-entry.js; then
            echo 'FAIL: competing legacy batch/publish loader is active.' >&2
            exit 1
          fi

          # Contract guard is event-driven, not a polling DOM controller.
          grep -q 'BUILD259_CLIENT_CONTRACT_GUARD_EVENT_DRIVEN' produce-copilot-contract-guard-v259.js
          grep -q 'acc-production-contract-updated' produce-copilot-contract-guard-v259.js
          grep -q 'acc-produce-package-updated' produce-copilot-contract-guard-v259.js
          if grep -Eq 'MutationObserver|setInterval\s*\(' produce-copilot-contract-guard-v259.js; then
            echo 'FAIL: contract guard regressed to DOM polling.' >&2
            exit 1
          fi

          # Poster provider hard limit remains fenced below 2048.
          grep -q 'IMAGE_PROMPT_LIMIT=1900' worker-brain-runtime-rescue-v9.js
          grep -q 'boundImagePrompt' worker-brain-runtime-rescue-v9.js

          # Produce cannot own viewport position or poll/remount the page.
          if grep -Eq 'MutationObserver|setInterval\s*\(|scrollTop\s*=|scrollIntoView\s*\(|window\.scroll(To|By)\s*\(' produce-copilot-v2578.js; then
            echo 'FAIL: consolidated Produce runtime contains polling or viewport control.' >&2
            exit 1
          fi
          grep -q 'window.dispatchEvent(new CustomEvent("acc-core-rendered"' app.js
          grep -q 'const productionRender=ui.tab==="production"' app.js
          grep -q 'if(!productionRender)scrollTo(0,scroll)' app.js
          grep -q 'window.addEventListener("acc-core-rendered",onCoreRendered)' produce-copilot-v2578.js

          # No native/legacy scroll runtime in active release/cache chain.
          if grep -q 'native-scroll-performance-' release-version-v257.js || grep -q 'native-scroll-performance-' service-worker.js; then
            echo 'FAIL: active runtime still loads a competing native scroll controller.' >&2
            exit 1
          fi

          echo 'Production + publishing stabilization contract OK.'

      - name: Validate Worker module syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            worker-brain-isolation-runtime-v1.js \
            worker-brain-runtime-rescue-v1.js \
            worker-brain-runtime-rescue-v2.js \
            worker-brain-runtime-rescue-v3.js \
            worker-brain-runtime-rescue-v4.js \
            worker-brain-runtime-rescue-v5.js \
            worker-brain-runtime-rescue-v6.js \
            worker-brain-runtime-rescue-v7.js \
            worker-brain-runtime-rescue-v8.js \
            worker-brain-runtime-rescue-v9.js \
            worker-channel-master-authority-v1.js \
            worker-contract-router-v258.js \
            worker-contract-router-v259.js \
            worker-build2577-entry.js \
            worker-division-passport-runtime-v1.js \
            worker-division-passport-runtime-v1-r4.js \
            worker-poster-resilience-v258.js \
            worker-copilot-master-runtime-v2577.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done

      - name: Validate local Worker imports and Wrangler entrypoint
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('.')
          wrangler = json.loads((root/'wrangler.jsonc').read_text())
          entry = wrangler.get('main')
          if not entry or not (root/entry).is_file():
              raise SystemExit(f'Invalid wrangler main: {entry!r}')
          files = [
              'worker-brain-isolation-runtime-v1.js',
              'worker-brain-runtime-rescue-v1.js',
              'worker-brain-runtime-rescue-v2.js',
              'worker-brain-runtime-rescue-v3.js',
              'worker-brain-runtime-rescue-v4.js',
              'worker-brain-runtime-rescue-v5.js',
              'worker-brain-runtime-rescue-v6.js',
              'worker-brain-runtime-rescue-v7.js',
              'worker-brain-runtime-rescue-v8.js',
              'worker-brain-runtime-rescue-v9.js',
              'worker-channel-master-authority-v1.js',
              'worker-contract-router-v258.js',
              'worker-contract-router-v259.js',
              'worker-build2577-entry.js',
              'worker-division-passport-runtime-v1.js',
              'worker-division-passport-runtime-v1-r4.js',
              'worker-poster-resilience-v258.js',
          ]
          missing=[]
          for name in files:
              source=(root/name).read_text()
              for rel in re.findall(r'from\s+["\'](\./[^"\']+)["\']', source):
                  target=(root/name).parent/rel
                  if not target.is_file(): missing.append(f'{name} -> {rel}')
          if missing:
              raise SystemExit('Missing imports:\n'+'\n'.join(missing))
          print('Runtime chain OK; wrangler main =', entry)
