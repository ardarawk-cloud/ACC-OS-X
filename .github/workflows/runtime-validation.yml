name: ACC OS X Runtime Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'app.js'
      - 'produce-copilot-v2576.js'
      - 'produce-copilot-preview-fix-v25762.js'
      - 'produce-copilot-brain-firewall-v1.js'
      - 'produce-copilot-batch-runtime-v2.js'
      - 'produce-copilot-batch-runtime-v3.js'
      - 'produce-copilot-publish-queue-v1.js'
      - 'produce-copilot-publish-queue-v2.js'
      - 'produce-copilot-contract-guard-v259.js'
      - 'produce-copilot-busy-watchdog-v1.js'
      - 'native-scroll-performance-v1.js'
      - 'native-scroll-performance-v2.js'
      - 'release-version-v257.js'
      - 'service-worker.js'
      - 'worker-brain-isolation-runtime-v1.js'
      - 'worker-brain-runtime-rescue-v1.js'
      - 'worker-brain-runtime-rescue-v2.js'
      - 'worker-brain-runtime-rescue-v3.js'
      - 'worker-brain-runtime-rescue-v4.js'
      - 'worker-brain-runtime-rescue-v5.js'
      - 'worker-brain-runtime-rescue-v6.js'
      - 'worker-brain-runtime-rescue-v7.js'
      - 'worker-brain-runtime-rescue-v8.js'
      - 'worker-brain-runtime-rescue-v9.js'
      - 'worker-channel-master-authority-v1.js'
      - 'worker-contract-router-v258.js'
      - 'worker-contract-router-v259.js'
      - 'worker-build2577-entry.js'
      - 'worker-division-passport-runtime-v1.js'
      - 'worker-division-passport-runtime-v1-r4.js'
      - 'worker-poster-resilience-v258.js'
      - 'worker-copilot-master-runtime-v2577.js'
      - 'wrangler.jsonc'
      - '.github/workflows/runtime-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate browser runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check produce-copilot-v2576.js
          node --check produce-copilot-preview-fix-v25762.js
          node --check produce-copilot-brain-firewall-v1.js
          node --check produce-copilot-batch-runtime-v2.js
          node --check produce-copilot-batch-runtime-v3.js
          node --check produce-copilot-publish-queue-v1.js
          node --check produce-copilot-publish-queue-v2.js
          node --input-type=module --check < produce-copilot-contract-guard-v259.js
          node --check produce-copilot-busy-watchdog-v1.js
          node --check native-scroll-performance-v1.js
          node --check native-scroll-performance-v2.js
          node --check release-version-v257.js
          node --check service-worker.js

      - name: Validate Produce single scroll authority
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'native-scroll-performance-' release-version-v257.js; then
            echo 'FAIL: release bootstrap still activates a native scroll runtime.' >&2
            exit 1
          fi
          grep -q 'BUILD257_6_5_PRODUCE_COPILOT_PAGE_FLOW' release-version-v257.js
          grep -q 'BUILD257_6_4_PREVIEW_ONLY_NO_SCROLL_CONTROL' release-version-v257.js
          if grep -q 'native-scroll-performance-' service-worker.js; then
            echo 'FAIL: active service-worker cache chain still includes a native scroll runtime.' >&2
            exit 1
          fi
          if grep -Eq 'scrollTop\s*=|scrollIntoView\s*\(|window\.scroll(To|By)\s*\(' produce-copilot-v2576.js produce-copilot-preview-fix-v25762.js; then
            echo 'FAIL: Produce runtime contains direct scroll-position control.' >&2
            exit 1
          fi
          if grep -q 'scrollTo(0,scroll)' app.js; then
            grep -q '__ACC_PRODUCE_PROGRAMMATIC_SCROLL_BLOCK_V1__' release-version-v257.js
            grep -q 'tab.active\[data-value="production"\]' release-version-v257.js
            grep -q 'PRODUCE_CORE_SCROLL_GUARD_V1' release-version-v257.js
            grep -q 'BUILD257_PRODUCE_CORE_SCROLL_GUARD_V1' service-worker.js
          fi
          echo 'Produce scroll authority OK: manual document scrolling is not overridden by the active Produce runtime.'

      - name: Validate Worker module syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            worker-brain-isolation-runtime-v1.js \
            worker-brain-runtime-rescue-v1.js \
            worker-brain-runtime-rescue-v2.js \
            worker-brain-runtime-rescue-v3.js \
            worker-brain-runtime-rescue-v4.js \
            worker-brain-runtime-rescue-v5.js \
            worker-brain-runtime-rescue-v6.js \
            worker-brain-runtime-rescue-v7.js \
            worker-brain-runtime-rescue-v8.js \
            worker-brain-runtime-rescue-v9.js \
            worker-channel-master-authority-v1.js \
            worker-contract-router-v258.js \
            worker-contract-router-v259.js \
            worker-build2577-entry.js \
            worker-division-passport-runtime-v1.js \
            worker-division-passport-runtime-v1-r4.js \
            worker-poster-resilience-v258.js \
            worker-copilot-master-runtime-v2577.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done

      - name: Validate local Worker imports and Wrangler entrypoint
        shell: python
        run: |
          import json, pathlib, re
          root = pathlib.Path('.')
          wrangler = json.loads((root/'wrangler.jsonc').read_text())
          entry = wrangler.get('main')
          if not entry or not (root/entry).is_file():
              raise SystemExit(f'Invalid wrangler main: {entry!r}')
          files = [
              'worker-brain-isolation-runtime-v1.js',
              'worker-brain-runtime-rescue-v1.js',
              'worker-brain-runtime-rescue-v2.js',
              'worker-brain-runtime-rescue-v3.js',
              'worker-brain-runtime-rescue-v4.js',
              'worker-brain-runtime-rescue-v5.js',
              'worker-brain-runtime-rescue-v6.js',
              'worker-brain-runtime-rescue-v7.js',
              'worker-brain-runtime-rescue-v8.js',
              'worker-brain-runtime-rescue-v9.js',
              'worker-channel-master-authority-v1.js',
              'worker-contract-router-v258.js',
              'worker-contract-router-v259.js',
              'worker-build2577-entry.js',
              'worker-division-passport-runtime-v1.js',
              'worker-division-passport-runtime-v1-r4.js',
              'worker-poster-resilience-v258.js',
          ]
          missing=[]
          for name in files:
              source=(root/name).read_text()
              for rel in re.findall(r'from\s+["\'](\./[^"\']+)["\']', source):
                  target=(root/name).parent/rel
                  if not target.is_file(): missing.append(f'{name} -> {rel}')
          if missing:
              raise SystemExit('Missing imports:\n'+'\n'.join(missing))
          print('Runtime chain OK; wrangler main =', entry)
