name: Security Secret Guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prevent-new-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject new private keys and secret files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(["git", *args], stderr=subprocess.STDOUT)

          base = git("rev-parse", "HEAD^").decode().strip()
          changed = [s.decode() for s in git("diff", "--name-only", "--diff-filter=AM", "-z", base, "HEAD").split(b"\0") if s]
          patterns = [
              re.compile(r"^-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"(?:ghp_|github_pat_)[a-zA-Z0-9_]{25,}"),
              re.compile(r"sk_(?:live|test)_[0-9a-zA-Z]{12,}"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bAIza[0-9A-Za-z_\-]{30,}\b"),
              re.compile(r"\b(?:CF_API_TOKEN|DISCORD_BOT_TOKEN|DANA_CLIENT_SECRET)\s*[:=]\s*['\"]?[A-Za-z0-9+/=_\-]{20,}"),
          ]
          findings = []
          for path in changed:
              name = pathlib.PurePosixPath(path).name.lower()
              secret_file = (name == ".env" or (name.startswith(".env.") and name not in {".env.example", ".env.sample"})
                  or name == ".dev.vars" or name.startswith(".dev.vars.")
                  or name in {"id_rsa", "id_ed25519", "credentials.json", "service-account.json"}
                  or name.endswith((".p12", ".pfx")))
              if secret_file:
                  findings.append((path, "private credential file"))
              patch = git("diff", "--unified=0", "--no-ext-diff", base, "HEAD", "--", path).decode("utf-8", errors="replace")
              for line in patch.splitlines():
                  if line.startswith("+") and not line.startswith("+++"):
                      text = line[1:].strip()
                      if any(regex.search(text) for regex in patterns):
                          findings.append((path, "credential-like value in new code"))
                          break
          if findings:
              for path, issue in sorted(set(findings)):
                  print(f"::error file={path}::{issue}. Remove from the commit and rotate the exposed key if real.")
              sys.exit(1)
          print("PASS: No newly committed credential files or known secret patterns.")
          PY
