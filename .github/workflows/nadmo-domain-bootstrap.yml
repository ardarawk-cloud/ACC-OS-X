name: NADMO Domain Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nadmo-domain-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find or create nadmo.id Cloudflare zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          LOOKUP="$(curl --fail-with-body --silent --show-error \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=nadmo.id&account.id=${CLOUDFLARE_ACCOUNT_ID}")"

          if [ "$(printf '%s' "$LOOKUP" | jq -r '.success')" != "true" ]; then
            printf '%s\n' "$LOOKUP" | jq '{success,errors,messages}'
            exit 1
          fi

          ZONE_COUNT="$(printf '%s' "$LOOKUP" | jq '.result | length')"
          if [ "$ZONE_COUNT" -gt 0 ]; then
            ZONE="$(printf '%s' "$LOOKUP" | jq '.result[0]')"
            echo 'nadmo.id already exists in Cloudflare account.'
          else
            CREATE="$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"nadmo.id\",\"account\":{\"id\":\"${CLOUDFLARE_ACCOUNT_ID}\"},\"type\":\"full\"}" \
              'https://api.cloudflare.com/client/v4/zones')"
            if [ "$(printf '%s' "$CREATE" | jq -r '.success')" != "true" ]; then
              printf '%s\n' "$CREATE" | jq '{success,errors,messages}'
              exit 1
            fi
            ZONE="$(printf '%s' "$CREATE" | jq '.result')"
            echo 'Created nadmo.id Cloudflare zone.'
          fi

          ZONE_ID="$(printf '%s' "$ZONE" | jq -r '.id')"
          STATUS="$(printf '%s' "$ZONE" | jq -r '.status')"
          NS="$(printf '%s' "$ZONE" | jq -r '.name_servers[]?')"

          echo "Zone ID: ${ZONE_ID}"
          echo "Status: ${STATUS}"
          echo 'Cloudflare nameservers:'
          printf '%s\n' "$NS"

          {
            echo '## NADMO Domain Bootstrap'
            echo
            echo "- Zone: **nadmo.id**"
            echo "- Status: **${STATUS}**"
            echo '- Replace Hostinger nameservers with:'
            while IFS= read -r ns; do
              [ -n "$ns" ] && echo "  - \`${ns}\`"
            done <<< "$NS"
            echo
            echo 'After registrar delegation becomes active, deploy the NADMO Worker custom domains for `nadmo.id` and `www.nadmo.id`.'
          } >> "$GITHUB_STEP_SUMMARY"
