name: ROAMINK DNS Cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roamink-dns-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roamink-dns-cutover
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: nadmo.id
      RECORD_NAME: roamink.nadmo.id
      RECORD_IP: 192.0.2.1
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}

    steps:
      - name: Cut over ROAMINK DNS to Cloudflare Worker route
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_DNS_API_TOKEN:-}"

          request() {
            curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer ${CLOUDFLARE_DNS_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          ZONE_RESPONSE="$(request --get \
            --data-urlencode "name=${ZONE_NAME}" \
            "https://api.cloudflare.com/client/v4/zones")"
          jq -e '.success == true' <<<"$ZONE_RESPONSE" >/dev/null
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONE_RESPONSE")"
          test -n "$ZONE_ID"

          EXISTING="$(request --get \
            --data-urlencode "name=${RECORD_NAME}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records")"
          jq -e '.success == true' <<<"$EXISTING" >/dev/null

          mapfile -t OLD_IDS < <(jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id' <<<"$EXISTING")
          for record_id in "${OLD_IDS[@]:-}"; do
            [ -n "$record_id" ] || continue
            DELETED="$(request -X DELETE \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}")"
            jq -e '.success == true' <<<"$DELETED" >/dev/null
            echo "Removed old ROAMINK A/AAAA/CNAME record ${record_id}"
          done

          PAYLOAD="$(jq -n \
            --arg name "$RECORD_NAME" \
            --arg content "$RECORD_IP" \
            '{type:"A",name:$name,content:$content,ttl:1,proxied:true}')"
          CREATED="$(request -X POST --data "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records")"
          jq -e '.success == true' <<<"$CREATED" >/dev/null
          test "$(jq -r '.result.proxied' <<<"$CREATED")" = true
          echo "ROAMINK DNS now proxied through Cloudflare."

      - name: Verify DNS and ROAMINK website
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            ANSWER="$(dig +short A "$RECORD_NAME" @1.1.1.1 | head -n1 || true)"
            CODE="$(curl --silent --show-error --location --output /tmp/roamink.html --write-out '%{http_code}' --max-time 30 "https://${RECORD_NAME}/" || true)"
            echo "attempt=$attempt DNS=${ANSWER:-none} HTTP=${CODE:-none}"
            if [ -n "$ANSWER" ] && [ "$CODE" = "200" ] && grep -q 'ROAMINK' /tmp/roamink.html; then
              echo "ROAMINK live on https://${RECORD_NAME}/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ROAMINK DNS/HTTPS verification did not pass in time."
          exit 1
