name: ACC OS X Android Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'acc-os-x-android-v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACC_OS_X_ANDROID_KEYSTORE_B64: ${{ secrets.ACC_OS_X_ANDROID_KEYSTORE_B64 }}
      ACC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACC_OS_X_ANDROID_KEYSTORE_PASSWORD }}
      ACC_ANDROID_KEY_ALIAS: ${{ secrets.ACC_OS_X_ANDROID_KEY_ALIAS }}
      ACC_ANDROID_KEY_PASSWORD: ${{ secrets.ACC_OS_X_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Validate production signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ACC_OS_X_ANDROID_KEYSTORE_B64 ACC_ANDROID_KEYSTORE_PASSWORD ACC_ANDROID_KEY_ALIAS ACC_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for production signing"
              exit 1
            fi
          done

      - name: Restore production keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/acc-os-x-production.jks"
          printf '%s' "$ACC_OS_X_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ACC_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed production APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: ACC-OS-X-Android-Production
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
