name: ACC OS X Android Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'assets/app-icons/my-maps-icons-sprite.jpg.b64'
      - 'ACC-OS-X-AUTHORITY.md'
      - 'scripts/verify-android-release-contract.sh'
      - '.github/workflows/android-production-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACC_OS_X_ANDROID_KEYSTORE_B64: ${{ secrets.ACC_OS_X_ANDROID_KEYSTORE_B64 }}
      ACC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACC_ANDROID_KEYSTORE_PASSWORD }}
      ACC_ANDROID_KEY_ALIAS: ${{ secrets.ACC_ANDROID_KEY_ALIAS }}
      ACC_ANDROID_KEY_PASSWORD: ${{ secrets.ACC_ANDROID_KEY_PASSWORD }}
      ACC_CANONICAL_CERT_SHA256: '33:76:70:DE:C0:F9:0B:72:74:8F:44:CC:F2:C0:52:9B:86:EA:E4:2C:1D:85:84:B4:C3:62:22:B2:B3:36:05:D5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce Android release contract
        shell: bash
        run: bash scripts/verify-android-release-contract.sh

      - name: Resolve Android release identity
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Unable to resolve Android versionName/versionCode"
            exit 1
          fi
          RELEASE_TAG="acc-os-x-android-v${VERSION_NAME}-build${VERSION_CODE}"
          echo "ACC_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "ACC_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ACC_RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Release: $RELEASE_TAG"

      - name: Validate production signing authority
        shell: bash
        run: |
          set -euo pipefail
          for name in ACC_OS_X_ANDROID_KEYSTORE_B64 ACC_ANDROID_KEYSTORE_PASSWORD ACC_ANDROID_KEY_ALIAS ACC_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required. STOP — NO DISTRIBUTABLE APK."
              exit 1
            fi
          done
          if [ "$ACC_ANDROID_KEY_ALIAS" != "accosx-production" ]; then
            echo "::error::Production signing alias drift. Expected accosx-production. STOP."
            exit 1
          fi

      - name: Reject duplicate production version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$ACC_RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $ACC_RELEASE_TAG already exists. Increase versionCode/versionName before another production release."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore production upload keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/acc-os-x-production-upload.jks"
          printf '%s' "$ACC_OS_X_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          echo "ACC_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Verify canonical production certificate
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA256="$(keytool -list -v \
            -keystore "$ACC_ANDROID_KEYSTORE_PATH" \
            -storepass "$ACC_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ACC_ANDROID_KEY_ALIAS" \
            | awk '/SHA256:/{print $2; exit}')"
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Unable to read production certificate fingerprint. STOP."
            exit 1
          fi
          if [ "$ACTUAL_SHA256" != "$ACC_CANONICAL_CERT_SHA256" ]; then
            echo "::error::Production signing certificate mismatch. Expected canonical ACC OS X certificate. STOP — DO NOT DISTRIBUTE."
            exit 1
          fi
          echo "Production certificate fingerprint VERIFIED."

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build signed production APK and Android App Bundle
        working-directory: android
        run: gradle --no-daemon clean assembleRelease bundleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          APK_SHA256="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED_COMPACT="$(printf '%s' "$ACC_CANONICAL_CERT_SHA256" | tr -d ':')"
          if [ -z "$APK_SHA256" ] || [ "$APK_SHA256" != "$EXPECTED_COMPACT" ]; then
            echo "::error::Built APK signer does not match canonical ACC OS X certificate. STOP — DO NOT DISTRIBUTE."
            exit 1
          fi

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "AAB signature verified"

      - name: Prepare stable release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acc-os-x-release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/acc-os-x-release/ACC-OS-X.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/acc-os-x-release/ACC-OS-X-Play.aab"

      - name: Export upload certificate fingerprints
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "$ACC_ANDROID_KEYSTORE_PATH" \
            -storepass "$ACC_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ACC_ANDROID_KEY_ALIAS" \
            > "$RUNNER_TEMP/acc-os-x-release/ACC-OS-X-upload-certificate.txt"
          grep -E 'Alias name:|SHA1:|SHA256:' "$RUNNER_TEMP/acc-os-x-release/ACC-OS-X-upload-certificate.txt" || true

      - name: Upload Play-ready AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACC-OS-X-Android-Play-AAB
          path: ${{ runner.temp }}/acc-os-x-release/ACC-OS-X-Play.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload sideload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACC-OS-X-Android-Production-APK
          path: ${{ runner.temp }}/acc-os-x-release/ACC-OS-X.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload upload-certificate metadata
        uses: actions/upload-artifact@v4
        with:
          name: ACC-OS-X-Android-Upload-Certificate
          path: ${{ runner.temp }}/acc-os-x-release/ACC-OS-X-upload-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$ACC_RELEASE_TAG"
          APK="$RUNNER_TEMP/acc-os-x-release/ACC-OS-X.apk"
          AAB="$RUNNER_TEMP/acc-os-x-release/ACC-OS-X-Play.aab"
          CERT="$RUNNER_TEMP/acc-os-x-release/ACC-OS-X-upload-certificate.txt"
          gh release create "$TAG" "$APK" "$AAB" "$CERT" \
            --target "$GITHUB_SHA" \
            --title "ACC OS X Android v${ACC_VERSION_NAME} / Build ${ACC_VERSION_CODE}" \
            --notes "Production-signed ACC OS X Android v${ACC_VERSION_NAME} / Build ${ACC_VERSION_CODE}. Normal update path: install over the existing ACC OS X; do not uninstall."
