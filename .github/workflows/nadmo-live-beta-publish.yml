name: NADMO LIVE beta deploy
on:
  push:
    branches: ['feat/nadmo-live-beta-worker-20261009']
    paths:
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/qa/cyberdeck-watchroom-layout.cjs'
      - 'nadmo-live-beta/qa/host-theme-viewer-isolation-e2e.cjs'
      - 'nadmo-live-beta/account.mjs'
      - 'nadmo-live-beta/worker.mjs'
      - '.github/workflows/nadmo-live-beta-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nadmo-live-beta-production
  cancel-in-progress: true
jobs:
  qc-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify creator cover and theme backend contract
        run: node nadmo-live-beta/qa/cyberdeck-cover-contract.mjs
      - name: Verify shipped HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          HTML=nadmo-live-beta/public/app/index.html
          grep -Fq 'id="coverChoose"' "$HTML"
          grep -Fq 'id="gameStreamQuality"' "$HTML"
          grep -Fq 'id="watchStreamQuality"' "$HTML"
          grep -Fq 'html[data-nadmo-ui-theme="cyberbw"]' "$HTML"
          if grep -Fq -- '--neon:var(--neon)' "$HTML";then
            echo "Cyclic theme token detected"
            exit 1
          fi
          node -e "const fs=require('fs'),vm=require('vm');let s=fs.readFileSync('nadmo-live-beta/public/app/index.html','utf8');let a=s.indexOf('<script>'),b=s.indexOf('</script>',a);if(a<0||b<a)process.exit(1);new vm.Script(s.slice(a+8,b));console.log('HTML_SCRIPT_SYNTAX_PASS')"
      - name: Test real PC and mobile cyberdeck layout
        shell: bash
        run: |
          npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund puppeteer-core@24
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          node nadmo-live-beta/qa/cyberdeck-watchroom-layout.cjs
          node nadmo-live-beta/qa/host-theme-viewer-isolation-e2e.cjs
      - name: Deploy same existing NADMO LIVE Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: nadmo-live-beta
          command: deploy --config wrangler.json
      - name: Verify actual live.nadmo.id page
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 25 https://live.nadmo.id/app/ -o /tmp/nadmo-live.html &&
               grep -Fq 'id="gameStreamQuality"' /tmp/nadmo-live.html &&
               grep -Fq 'id="coverChoose"' /tmp/nadmo-live.html;then
              echo 'NADMO_LIVE_PRODUCTION_APP_QC_PASS'
              exit 0
            fi
            sleep 6
          done
          echo 'NADMO LIVE browser verification failed'
          exit 1
