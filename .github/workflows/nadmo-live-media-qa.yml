name: NADMO LIVE Browser Media E2E
on:
  workflow_dispatch:
  push:
    branches: ['feat/nadmo-live-beta-worker-20261009']
    paths:
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/worker.mjs'
      - 'nadmo-live-beta/qa/browser-media-e2e.cjs'
      - '.github/workflows/nadmo-live-media-qa.yml'
concurrency:
  group: nadmo-live-browser-e2e
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser automation
        run: npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund puppeteer-core@24
      - name: Locate Chromium
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify real browser video/audio and creator AFK
        run: node nadmo-live-beta/qa/browser-media-e2e.cjs
