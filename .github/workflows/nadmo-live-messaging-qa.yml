name: NADMO LIVE Messaging QA
on:
  push:
    branches: ['feat/nadmo-live-messaging-v1-20261105']
  pull_request:
    paths:
      - 'nadmo-live-beta/account.mjs'
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/qa/messaging-upgrade-unit.test.mjs'
      - '.github/workflows/nadmo-live-messaging-qa.yml'
permissions:
  contents: read
jobs:
  messaging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax
        run: |
          node --check nadmo-live-beta/account.mjs
          node --check nadmo-live-beta/worker.mjs
          node -e "const s=require('fs').readFileSync('nadmo-live-beta/public/app/index.html','utf8');const x=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!x)process.exit(1);new (require('vm').Script)(x[1]);console.log('MESSAGE_FRONTEND_PARSE_PASS');"
      - name: Run DM authorization and deletion QA
        run: node --test nadmo-live-beta/qa/messaging-upgrade-unit.test.mjs
      - name: Verify existing account / message privacy contract
        run: node --check nadmo-live-beta/qa/moshi-chat-modern-e2e.mjs
