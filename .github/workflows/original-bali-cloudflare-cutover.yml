name: Original Bali Cloudflare Cutover
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/original-bali-cloudflare-cutover.yml'
      - 'nadmo-cloudflare/original-bali/**'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and deploy
        run: |
          set -e
          cd nadmo-cloudflare/original-bali/source
          npm install
          npm run build
          cd ..
          npx wrangler@4.115.0 deploy --config wrangler.deploy.json
      - name: Cut over DNS
        shell: bash
        run: |
          set -euo pipefail
          request(){ curl --silent --show-error --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_DNS_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          Z="$(request --get --data-urlencode "name=nadmo.id" https://api.cloudflare.com/client/v4/zones)"
          ZID="$(jq -r '.result[0].id // empty' <<<"$Z")"
          E="$(request --get --data-urlencode "name=originalbali.nadmo.id" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records")"
          while read -r id; do [ -z "$id" ] || request -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$id" >/dev/null; done < <(jq -r '.result[].id' <<<"$E")
          P='{"type":"A","name":"originalbali.nadmo.id","content":"192.0.2.1","ttl":1,"proxied":true}'
          request -X POST --data "$P" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" | jq -e '.success==true' >/dev/null
      - name: Verify
        run: |
          for n in $(seq 1 12); do
            body="$(curl -sS --max-time 15 https://originalbali.nadmo.id/api/_healthcheck || true)"
            echo "$body" | grep -Eqi 'ok|success|cloudflare' && exit 0
            sleep 4
          done
          exit 1
