name: ROAMINK Worldwide Catalog Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roamink-digiflazz-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify worldwide catalog state
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="$(curl --silent --show-error --fail --max-time 60 https://roamink.nadmo.id/api/catalog)"
          printf '%s' "$CATALOG" > /tmp/catalog.json
          jq -c '{
            source,
            supplier_configured,
            error:(.error // null),
            product_count:(.products|length),
            destination_count:(.destinations|length),
            digiflazz_products:([.products[] | select(.supplier=="digiflazz")]|length),
            sample_destinations:(.destinations[0:12]|map(.name))
          }' /tmp/catalog.json
