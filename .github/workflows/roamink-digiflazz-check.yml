name: ROAMINK Digiflazz Cooldown Verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roamink-digiflazz-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Digiflazz rate-limit window
        shell: bash
        run: sleep 430

      - name: Verify cron-refreshed live eSIM catalog
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="$(curl --silent --show-error --fail --max-time 45 https://roamink.nadmo.id/api/catalog)"
          echo "$CATALOG" > /tmp/catalog.json

          jq -e '.source == "digiflazz" or .source == "digiflazz-cache"' /tmp/catalog.json >/dev/null
          jq -e '(.products|length) > 0 and (.destinations|length) > 0' /tmp/catalog.json >/dev/null
          jq -e '[.products[] | select(.supplier == "digiflazz" and (.supplier_sku|length) > 0 and .supplier_price > 0)] | length > 0' /tmp/catalog.json >/dev/null

          jq -c '{
            source,
            product_count:(.products|length),
            destination_count:(.destinations|length),
            pricing,
            sample:(.products[0:8] | map({
              title,
              destination_slug,
              data_label,
              validity_days,
              retail_price_minor,
              supplier_sku,
              supplier_price
            }))
          }' /tmp/catalog.json
