name: ROAMINK Digiflazz Final Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roamink-digiflazz-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DIGIFLAZZ_USERNAME: ${{ secrets.ROAMINK_DIGIFLAZZ_USERNAME || secrets.DIGIFLAZZ_USERNAME }}
      DIGIFLAZZ_API_KEY: ${{ secrets.ROAMINK_DIGIFLAZZ_API_KEY || secrets.DIGIFLAZZ_API_KEY }}
    steps:
      - name: Query Digiflazz eSIM price list once through VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DIGIFLAZZ_USERNAME:-}"
          test -n "${DIGIFLAZZ_API_KEY:-}"

          SIGN="$(printf '%s' "${DIGIFLAZZ_USERNAME}${DIGIFLAZZ_API_KEY}pricelist" | md5sum | awk '{print $1}')"
          BODY="$(jq -cn --arg username "$DIGIFLAZZ_USERNAME" --arg sign "$SIGN" '{cmd:"prepaid",username:$username,sign:$sign,brand:"eSIM"}')"

          HTTP="$(curl --silent --show-error --max-time 45             --output /tmp/digiflazz.json             --write-out '%{http_code}'             -H 'Content-Type: application/json'             --data "$BODY"             https://relay.nadmo.id/digiflazz/price-list || true)"

          echo "HTTP=$HTTP"
          jq -c '
            if (.data|type) == "array" then
              {
                kind:"catalog",
                count:(.data|length),
                brands:(.data|map(.brand)|unique),
                categories:(.data|map(.category)|unique),
                sample:(.data[0:5]|map({
                  product_name,
                  buyer_sku_code,
                  category,
                  brand,
                  type,
                  price,
                  buyer_product_status,
                  seller_product_status,
                  unlimited_stock,
                  stock
                }))
              }
            elif (.data|type) == "object" then
              {kind:"error",data:{rc:(.data.rc // null),message:(.data.message // null)}}
            else
              {kind:"other",keys:(keys),rc:(.rc // null),message:(.message // null),error:(.error // null),data_type:(.data|type)}
            end
          ' /tmp/digiflazz.json
