name: ROAMINK Digiflazz Check
# check-relay-restarted

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/roamink-digiflazz-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DIGIFLAZZ_USERNAME: ${{ secrets.ROAMINK_DIGIFLAZZ_USERNAME || secrets.DIGIFLAZZ_USERNAME }}
      DIGIFLAZZ_API_KEY: ${{ secrets.ROAMINK_DIGIFLAZZ_API_KEY || secrets.DIGIFLAZZ_API_KEY }}
    steps:
      - name: Check configured secrets and live supplier state
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DIGIFLAZZ_USERNAME:-}" ]; then echo "DIGIFLAZZ_USERNAME_SET=yes"; else echo "DIGIFLAZZ_USERNAME_SET=no"; fi
          if [ -n "${DIGIFLAZZ_API_KEY:-}" ]; then echo "DIGIFLAZZ_API_KEY_SET=yes"; else echo "DIGIFLAZZ_API_KEY_SET=no"; fi
          DEV_CONFIG="$(curl --silent --show-error --fail --max-time 30 https://roamink.ardarawk.workers.dev/api/config)"
          echo "WORKERS_DEV_CONFIG=$DEV_CONFIG"
          CONFIG="$(curl --silent --show-error --fail --max-time 30 https://roamink.nadmo.id/api/config)"
          echo "DOMAIN_CONFIG=$CONFIG"
          if jq -e '.supplier_configured == true' <<<"$CONFIG" >/dev/null 2>&1; then
            CHECK="$(curl --silent --show-error --max-time 45 https://roamink.nadmo.id/api/supplier-credential-check || true)"
            echo "SUPPLIER_CHECK=$CHECK"
          fi



      - name: Summarize live ROAMINK eSIM catalog
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="$(curl --silent --show-error --fail --max-time 45 https://roamink.nadmo.id/api/catalog)"
          echo "$CATALOG" | jq -c '{
            source,
            supplier_configured,
            product_count:(.products|length),
            destination_count:(.destinations|length),
            pricing,
            sample_products:(.products[0:5] | map({title,destination_slug,data_label,validity_days,retail_price_minor,supplier,supplier_sku}))
          }'
