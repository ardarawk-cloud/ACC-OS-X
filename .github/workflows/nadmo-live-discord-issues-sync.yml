name: NADMO LIVE Bug Reports → GitHub Issues

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/nadmo-live-discord-bugbot-20261107
    paths:
      - '.github/workflows/nadmo-live-discord-issues-sync.yml'
      - 'apps/nadmo-live-discord-bugbot/sync-github-issues.mjs'

permissions:
  contents: read
  issues: write

concurrency:
  group: nadmo-live-discord-issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check apps/nadmo-live-discord-bugbot/sync-github-issues.mjs
      - name: Validate Discord bot signature handling
        run: |
          node --check apps/nadmo-live-discord-bugbot/worker.mjs
          node --test apps/nadmo-live-discord-bugbot/test.mjs
      - name: Sync private R2 tickets to sanitized GitHub issues
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/nadmo-live-discord-bugbot/sync-github-issues.mjs
