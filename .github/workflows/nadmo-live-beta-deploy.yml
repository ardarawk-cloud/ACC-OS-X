name: NADMO LIVE Beta Cloudflare Worker
on:
  push:
    branches:
      - 'feat/nadmo-live-beta-worker-20261009'
    paths:
      - 'nadmo-live-beta/**'
      - '.github/workflows/nadmo-live-beta-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nadmo-live-beta-worker
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check nadmo-live-beta/worker.mjs
          node --check nadmo-live-beta/account.mjs
          node --check nadmo-live-beta/wallet.mjs
          node --check nadmo-live-beta/qa/wallet-unit.mjs
          node --check nadmo-live-beta/qa/wallet-endpoint-e2e.mjs
          node --check nadmo-live-beta/supporter-levels.mjs
          node --check nadmo-live-beta/qa/supporter-levels-unit.mjs
          node --check nadmo-live-beta/qa/supporter-badges-e2e.cjs
          node --check nadmo-live-beta/qa/room-safety-smoke.cjs
          node --check nadmo-live-beta/qa/room-safety-ui-e2e.cjs
          node --check nadmo-live-beta/qa/avatar-crop-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/social-feed-sharing-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/moshi-chat-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/creator-profile-navigation-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/offgrid-guest-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/single-avatar-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/custom-domain-contract.mjs
          node --check nadmo-live-beta/qa/auth-modes-official-domain-e2e.cjs
          node --check nadmo-live-beta/qa/profile-links-immediate-mobile-e2e.cjs
          node --check nadmo-live-beta/qa/moshi-chat-modern-e2e.mjs
          node --check nadmo-live-beta/qa/social-follow-structure.mjs
          node --check nadmo-live-beta/qa/live-feed-compact-e2e.cjs
          node --check nadmo-live-beta/qa/streamer-name-layout-e2e.cjs
          node --check nadmo-live-beta/qa/viewer-invite-e2e.cjs
          node --check nadmo-live-beta/qa/guest-stage-media-e2e.cjs
          node --check nadmo-live-beta/qa/ice-burst-signaling-e2e.mjs
          node -e "const fs=require('fs'),vm=require('vm'); const s=fs.readFileSync('nadmo-live-beta/public/app/index.html','utf8'); const js=s.match(/<script>([\\s\\S]*?)<\\/script>/); if(!js)process.exit(1);new vm.Script(js[1]);console.log('APP INLINE JAVASCRIPT SYNTAX PASS')"
      - name: Verify live.nadmo.id hostname, same-origin APIs and legacy Android compatibility
        run: node nadmo-live-beta/qa/custom-domain-contract.mjs
      - name: Verify ME Followers/Following and locked GO LIVE signature
        run: node nadmo-live-beta/qa/social-follow-structure.mjs
      - name: Verify all supporter level and privacy calculation boundaries
        run: node nadmo-live-beta/qa/supporter-levels-unit.mjs
      - name: Verify wallet ledger and withdrawal safety
        run: node nadmo-live-beta/qa/wallet-unit.mjs
      - name: Prepare owner-signed NADMO LIVE v0.9.2 and legacy APK downloads
        shell: bash
        run: |
          set -euo pipefail
          STAGING="nadmo-live-beta/public/downloads"
          mkdir -p "$STAGING"
          for VERSION in 0.9.1 0.9.2; do
            RELEASE="https://github.com/ardarawk-cloud/ACC-Builder-Apk/releases/download/nadmo-live-v${VERSION}-beta"
            APK="NADMO-LIVE-v${VERSION}-beta.apk"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 90 \
              "$RELEASE/$APK" --output "$STAGING/$APK"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 30 \
              "$RELEASE/NADMO-LIVE-v${VERSION}-beta.sha256" \
              --output "$STAGING/NADMO-LIVE-v${VERSION}-beta.sha256"
            (
              cd "$STAGING"
              sha256sum --check "NADMO-LIVE-v${VERSION}-beta.sha256"
              test "$(wc -c < "$APK")" -gt 500000
              unzip -t "$APK" | tail -n 2
              unzip -l "$APK" | grep -F 'AndroidManifest.xml'
            )
          done
          echo "Both signed APKs verified byte-for-byte against official release checksums."
      - name: Deploy isolated beta Worker (do not modify production apps)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: 'nadmo-live-beta'
          command: deploy --config wrangler.json
      - name: Verify public beta health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Worker deployment URL: ${DEPLOYMENT_URL:-not returned}"
          if [ -z "${DEPLOYMENT_URL:-}" ]; then
            echo "No automatic URL; check Cloudflare deployment output"
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "${DEPLOYMENT_URL%/}/health" | grep -q '"service":"nadmo-live-beta"'; then
              echo "NADMO LIVE BETA HEALTH PASS"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify official live.nadmo.id HTTPS, health and app landing
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            echo "Checking live.nadmo.id custom hostname (attempt ${i}/18)"
            if curl --silent --show-error --fail --max-time 12 --output /tmp/nadmo-live-domain-health.json https://live.nadmo.id/health \
              && grep -Fq '"service":"nadmo-live-beta"' /tmp/nadmo-live-domain-health.json \
              && [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 12 https://live.nadmo.id/)" = '308' ] \
              && curl --silent --show-error --fail --location --max-time 12 --output /tmp/nadmo-live-domain-app.html https://live.nadmo.id/ \
              && grep -Fq 'NADMO LIVE' /tmp/nadmo-live-domain-app.html; then
              echo "OFFICIAL NADMO LIVE DOMAIN HTTPS + APPLICATION PASS"
              exit 0
            fi
            sleep 7
          done
          echo "::error::Custom domain not responding. Check Cloudflare zone nadmo.id and Worker custom domain/SSL permission."
          exit 1
      - name: Verify official Android APK downloads directly from live.nadmo.id
        shell: bash
        run: |
          set -euo pipefail
          URL="https://live.nadmo.id/download.apk"
          curl --fail --silent --show-error --max-time 60 --dump-header /tmp/nadmo-apk-headers.txt \
            --output /tmp/nadmo-live-direct.apk "$URL"
          grep -Fqi 'Content-Type: application/vnd.android.package-archive' /tmp/nadmo-apk-headers.txt
          grep -Fqi 'Content-Disposition: attachment; filename="NADMO-LIVE-v0.9.2-beta.apk"' /tmp/nadmo-apk-headers.txt
          cmp /tmp/nadmo-live-direct.apk nadmo-live-beta/public/downloads/NADMO-LIVE-v0.9.2-beta.apk
          curl --fail --silent --show-error --max-time 60 --output /tmp/nadmo-live-legacy.apk https://live.nadmo.id/NADMO-LIVE-v0.9.1-beta.apk
          cmp /tmp/nadmo-live-legacy.apk nadmo-live-beta/public/downloads/NADMO-LIVE-v0.9.1-beta.apk
          echo "DIRECT NADMO LIVE APK DOWNLOAD PASS: $(wc -c < /tmp/nadmo-live-direct.apk) bytes"
      - name: Install creator ownership QA dependencies
        run: npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund ws@8
      - name: Verify ICE candidate bursts do not disconnect GAME hosts
        run: node nadmo-live-beta/qa/ice-burst-signaling-e2e.mjs
      - name: Verify wallet authentication and reject unverified cashout
        run: node nadmo-live-beta/qa/wallet-endpoint-e2e.mjs
      - name: Verify secure account photo upload, public avatar and deletion
        run: node nadmo-live-beta/qa/avatar-upload-e2e.mjs
      - name: Verify unified social publishing, account follows and chat privacy
        run: node nadmo-live-beta/qa/unified-social-messages-e2e.mjs
      - name: Verify direct chat, unread/read and opt-in requests on backend
        run: node nadmo-live-beta/qa/moshi-chat-modern-e2e.mjs
      - name: Verify account-bound resume and logout revocation against deployed Worker
        run: node nadmo-live-beta/qa/creator-ownership-smoke.cjs
      - name: Verify server enforced reports and host mute/kick/block
        run: node nadmo-live-beta/qa/room-safety-smoke.cjs
      - name: Install browser authentication QA
        run: npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund puppeteer-core@24
      - name: Locate Chrome for real browser account tests
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
          echo "CHROME_BIN=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify existing account can log in at official domain using only username and password
        run: node nadmo-live-beta/qa/auth-modes-official-domain-e2e.cjs
      - name: Verify profile links save instantly to ME and public profile after reload
        run: node nadmo-live-beta/qa/profile-links-immediate-mobile-e2e.cjs
      - name: Verify account registration, linked profiles and private draft posts after deploy
        run: node nadmo-live-beta/qa/account-auth-e2e.cjs
      - name: Verify supporter badge tier preview and immutable verified balances in real mobile browser
        run: node nadmo-live-beta/qa/supporter-badges-e2e.cjs
      - name: Verify mobile ME, direct wallet and public social post flow
        run: node nadmo-live-beta/qa/me-one-mobile-e2e.cjs
      - name: Verify gallery avatar crop gestures, cancel and final upload in mobile browser
        run: node nadmo-live-beta/qa/avatar-crop-mobile-e2e.cjs
      - name: Verify content-first social cards and share-to-SOSIAL/MEs on mobile
        run: node nadmo-live-beta/qa/social-feed-sharing-mobile-e2e.cjs
      - name: Verify MOSHI mobile inbox avatars, direct chat, unread notifications and settings
        run: node nadmo-live-beta/qa/moshi-chat-mobile-e2e.cjs
      - name: Verify profile navigation from Followers Following and PESAN; no redundant GO LIVE text
        run: node nadmo-live-beta/qa/creator-profile-navigation-mobile-e2e.cjs
      - name: Verify OFFGRID emergency information without login or internet and PT footer
        run: node nadmo-live-beta/qa/offgrid-guest-mobile-e2e.cjs
      - name: Verify social and message avatars never show picture plus letter twice on mobile
        run: node nadmo-live-beta/qa/single-avatar-mobile-e2e.cjs
      - name: Verify mobile viewer reports and host moderation UI
        run: node nadmo-live-beta/qa/room-safety-ui-e2e.cjs
      - name: Verify LIVE discovery compact on mobile and PC (screenshots)
        run: node nadmo-live-beta/qa/live-feed-compact-e2e.cjs
      - name: Verify long creator names never overflow phone and PC live cards
        run: node nadmo-live-beta/qa/streamer-name-layout-e2e.cjs
      - name: Verify public and private guest invitation links on fresh mobile sessions
        run: node nadmo-live-beta/qa/viewer-invite-e2e.cjs
      - name: Verify real guest camera and voice uplink to host and viewer, mic/camera toggles
        run: node nadmo-live-beta/qa/guest-stage-media-e2e.cjs
      - name: Keep visual QC screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nadmo-live-feed-compact-visual-qc
          path: nadmo-live-beta/qa/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
