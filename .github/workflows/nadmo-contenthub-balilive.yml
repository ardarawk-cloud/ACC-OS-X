name: NADMO ContentHub BaliLive Cloudflare
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nadmo-contenthub-balilive.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and deploy Content Hub
        run: |
          set -e
          cd nadmo-cloudflare/acc-content-hub/source
          npm install
          npm run build
          cd ..
          sed 's/2026-09-29/2026-09-28/g' wrangler.template.json > wrangler.deploy.json
          npx wrangler@4.115.0 deploy --config wrangler.deploy.json
      - name: Build and deploy Bali Live
        run: |
          set -e
          cd nadmo-cloudflare/bali-live/source
          npm install
          npm run build
          cd ..
          sed 's/2026-09-29/2026-09-28/g' wrangler.template.json > wrangler.deploy.json
          npx wrangler@4.115.0 deploy --config wrangler.deploy.json
      - name: Verify
        run: |
          set -e
          for host in contenthub.nadmo.id balilive.nadmo.id; do
            ok=0
            for n in $(seq 1 10); do
              body="$(curl -sS --max-time 15 "https://$host/api/_healthcheck" || true)"
              echo "$body" | grep -Eqi 'ok|success|cloudflare|nadmo' && { echo "$host OK"; ok=1; break; }
              sleep 4
            done
            test "$ok" = 1
          done
