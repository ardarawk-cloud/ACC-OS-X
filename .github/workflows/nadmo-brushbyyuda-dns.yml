name: NADMO Brush by Yuda DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nadmo-brushbyyuda-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_URL: https://brushbyyuda.nadmo.id/
      FALLBACK_URL: https://brush-by-yuda-christ-2e5tsl.v2.appdeploy.ai/
      RECORD_NAME: brushbyyuda.nadmo.id
      RECORD_TARGET: proxy-v2.appdeploy.ai
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
    steps:
      - name: Verify DNS record
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_DNS_API_TOKEN:-}"
          ANSWER="$(dig +short CNAME "${RECORD_NAME}" @1.1.1.1 | head -n1 | sed 's/\.$//' || true)"
          echo "CNAME: ${ANSWER:-no answer}"
          test "$ANSWER" = "$RECORD_TARGET"

      - name: Compare custom and fallback responses
        run: |
          set -euo pipefail
          CUSTOM_CODE="$(curl --silent --show-error --location --dump-header /tmp/custom.headers --output /tmp/custom.html --write-out '%{http_code}' --max-time 30 "$LIVE_URL")"
          FALLBACK_CODE="$(curl --silent --show-error --location --dump-header /tmp/fallback.headers --output /tmp/fallback.html --write-out '%{http_code}' --max-time 30 "$FALLBACK_URL")"
          echo "Custom HTTP: $CUSTOM_CODE"
          echo "Fallback HTTP: $FALLBACK_CODE"
          echo 'Custom title:'
          grep -oi '<title[^>]*>[^<]*' /tmp/custom.html | head -n1 || true
          echo 'Fallback title:'
          grep -oi '<title[^>]*>[^<]*' /tmp/fallback.html | head -n1 || true
          echo 'Custom content type:'
          grep -i '^content-type:' /tmp/custom.headers | tail -n1 || true
          echo 'Fallback content type:'
          grep -i '^content-type:' /tmp/fallback.headers | tail -n1 || true
          echo 'Hashes:'
          sha256sum /tmp/custom.html /tmp/fallback.html
          echo 'Custom body prefix:'
          head -c 500 /tmp/custom.html | tr '\n' ' '; echo
          echo 'Fallback body prefix:'
          head -c 500 /tmp/fallback.html | tr '\n' ' '; echo
          test "$CUSTOM_CODE" = "200"
          test "$FALLBACK_CODE" = "200"
