name: NADMO Brush by Yuda DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nadmo-brushbyyuda-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nadmo-brushbyyuda-dns
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: nadmo.id
      RECORD_NAME: brushbyyuda.nadmo.id
      RECORD_TARGET: proxy-v2.appdeploy.ai
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Create or update Brush CNAME
        run: |
          set -euo pipefail

          request() {
            curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          ZONES="$(request --get \
            --data-urlencode "name=${ZONE_NAME}" \
            --data-urlencode "account.id=${CLOUDFLARE_ACCOUNT_ID}" \
            "https://api.cloudflare.com/client/v4/zones")"
          jq -e '.success == true' <<<"$ZONES" >/dev/null
          ZONE_ID="$(jq -r '.result[0].id // empty' <<<"$ZONES")"
          test -n "$ZONE_ID"

          EXISTING="$(request --get \
            --data-urlencode "name=${RECORD_NAME}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records")"
          jq -e '.success == true' <<<"$EXISTING" >/dev/null
          RECORD_ID="$(jq -r '.result[0].id // empty' <<<"$EXISTING")"

          PAYLOAD="$(jq -n \
            --arg type "CNAME" \
            --arg name "$RECORD_NAME" \
            --arg content "$RECORD_TARGET" \
            '{type:$type,name:$name,content:$content,ttl:1,proxied:false}')"

          if [ -n "$RECORD_ID" ]; then
            RESULT="$(request -X PUT \
              --data "$PAYLOAD" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${RECORD_ID}")"
            ACTION=updated
          else
            RESULT="$(request -X POST \
              --data "$PAYLOAD" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records")"
            ACTION=created
          fi

          jq -e '.success == true' <<<"$RESULT" >/dev/null
          TYPE="$(jq -r '.result.type' <<<"$RESULT")"
          NAME="$(jq -r '.result.name' <<<"$RESULT")"
          CONTENT="$(jq -r '.result.content' <<<"$RESULT")"
          PROXIED="$(jq -r '.result.proxied' <<<"$RESULT")"

          test "$TYPE" = "CNAME"
          test "$NAME" = "$RECORD_NAME"
          test "$CONTENT" = "$RECORD_TARGET"
          test "$PROXIED" = "false"

          {
            echo "## Brush by Yuda DNS"
            echo
            echo "- Action: **${ACTION}**"
            echo "- Record: \`${RECORD_NAME}\`"
            echo "- Type: \`CNAME\`"
            echo "- Target: \`${RECORD_TARGET}\`"
            echo "- Cloudflare proxy: \`off\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "${ACTION}: ${RECORD_NAME} -> ${RECORD_TARGET}"

      - name: DNS lookup check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            ANSWER="$(dig +short CNAME "${RECORD_NAME}" @1.1.1.1 | head -n1 | sed 's/\.$//' || true)"
            echo "Attempt ${attempt}: ${ANSWER:-no answer}"
            if [ "$ANSWER" = "$RECORD_TARGET" ]; then
              exit 0
            fi
            sleep 10
          done
          echo '::warning::Cloudflare API update succeeded, but public resolver has not returned the CNAME yet.'
