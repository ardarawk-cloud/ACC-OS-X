name: NADMO Brush by Yuda DNS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nadmo-brushbyyuda-dns.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_URL: https://brushbyyuda.nadmo.id/
      RECORD_NAME: brushbyyuda.nadmo.id
      RECORD_TARGET: proxy-v2.appdeploy.ai
      CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
    steps:
      - name: Verify DNS and HTTPS
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_DNS_API_TOKEN:-}"
          ANSWER="$(dig +short CNAME "${RECORD_NAME}" @1.1.1.1 | head -n1 | sed 's/\.$//' || true)"
          echo "CNAME: ${ANSWER:-no answer}"
          test "$ANSWER" = "$RECORD_TARGET"
          CODE="$(curl --silent --show-error --location --output /tmp/brush.html --write-out '%{http_code}' --max-time 30 "$LIVE_URL")"
          echo "HTTP ${CODE}"
          test "$CODE" = "200"
          grep -q '<title>Brush by Yuda Christ' /tmp/brush.html
          echo 'DNS + HTTPS verified.'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/brush-qc
          cd /tmp/brush-qc
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Mobile runtime QC 390 and 360
        run: |
          set -euo pipefail
          cd /tmp/brush-qc
          cat > qc.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const vp of [{width:390,height:844},{width:360,height:800}]){
              const page=await browser.newPage({viewport:vp});
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));
              const response=await page.goto(process.env.LIVE_URL,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1500);
              await page.evaluate(async()=>{
                const delay=ms=>new Promise(r=>setTimeout(r,ms));
                for(let y=0;y<document.documentElement.scrollHeight;y+=600){window.scrollTo(0,y);await delay(120)}
                window.scrollTo(0,document.documentElement.scrollHeight);
              });
              await page.waitForTimeout(2500);
              if(!response || response.status()>=400) throw new Error(`HTTP ${response&&response.status()} at ${vp.width}`);
              const s=await page.evaluate(()=>({
                title:document.title,
                text:document.body.innerText,
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                imgs:[...document.querySelectorAll('img[data-photo]')].map(i=>({complete:i.complete,w:i.naturalWidth,h:i.naturalHeight,photo:i.dataset.photo})),
                width:window.innerWidth
              }));
              if(!s.title.includes('Brush by Yuda Christ')) throw new Error(`title mismatch ${vp.width}`);
              if(!s.text.includes('Beauty with presence.')) throw new Error(`hero missing ${vp.width}`);
              if(s.overflow>1) throw new Error(`horizontal overflow ${vp.width}: ${s.overflow}px`);
              if(s.imgs.length!==8) throw new Error(`expected 8 site image elements, got ${s.imgs.length} at ${vp.width}`);
              const bad=s.imgs.filter(i=>!i.complete||i.w===0||i.h===0);
              if(bad.length) throw new Error(`site image load failure ${vp.width}: ${JSON.stringify(bad)}`);
              if(pageErrors.length) throw new Error(`page errors ${vp.width}: ${pageErrors.join(' | ')}`);
              console.log(`PASS ${vp.width}x${vp.height} | images=${s.imgs.length}/8 loaded | overflow=${s.overflow}px | pageErrors=0`);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node qc.js
