name: NADMO LIVE Messaging v2 QA
on:
  push:
    branches:
      - 'feat/nadmo-live-messaging-v2-20261105'
  pull_request:
    paths:
      - 'nadmo-live-beta/account.mjs'
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/qa/messaging-upgrade-unit.test.mjs'
permissions:
  contents: read
jobs:
  message-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check nadmo-live-beta/account.mjs
          node --check nadmo-live-beta/worker.mjs
          node -e "const s=require('fs').readFileSync('nadmo-live-beta/public/app/index.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)process.exit(1);new (require('vm').Script)(m[1]);console.log('FRONTEND_V2_PARSE_PASS')"
      - name: DM 26 server-side tests
        run: node --test nadmo-live-beta/qa/messaging-upgrade-unit.test.mjs
