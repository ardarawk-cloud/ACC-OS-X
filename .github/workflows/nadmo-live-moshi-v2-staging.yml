name: NADMO LIVE MOSHI V2 — Isolated Staging
on:
  push:
    branches: ['feat/nadmo-live-moshi-messages-v2-20261105']
    paths:
      - 'nadmo-live-beta/account.mjs'
      - 'nadmo-live-beta/messages-v2.mjs'
      - 'nadmo-live-beta/worker.mjs'
      - 'nadmo-live-beta/public/app/index.html'
      - 'nadmo-live-beta/wrangler.moshi-staging.json'
      - '.github/workflows/nadmo-live-moshi-v2-staging.yml'
permissions:
  contents: read
concurrency:
  group: nadmo-live-moshi-v2-staging
  cancel-in-progress: true
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging isolation and source safety
        shell: bash
        run: |
          set -euo pipefail
          node --check nadmo-live-beta/messages-v2.mjs
          node --check nadmo-live-beta/account.mjs
          node --check nadmo-live-beta/worker.mjs
          node --test nadmo-live-beta/qa/moshi-messages-v2.test.mjs
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('nadmo-live-beta/wrangler.moshi-staging.json'));if(c.name!=='nadmo-live-moshi-v2-staging'||c.routes||c.r2_buckets||!c.durable_objects||c.vars?.NADMO_MOSHI_STAGING!=='true')throw Error('staging isolation fail');console.log('STAGING_ISOLATED_PASS')"
      - name: Deploy separate staging Worker only
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: nadmo-live-beta
          command: deploy --config wrangler.moshi-staging.json
      - name: Smoke-check isolated staging routes
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nadmo-live-moshi-v2-staging.ardarawk.workers.dev'
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 25 "$URL/health" -o /tmp/moshi-health &&
               curl --fail --silent --show-error --max-time 25 "$URL/app/" -o /tmp/moshi-app &&
               grep -Fq 'id="messageThreadMenu"' /tmp/moshi-app &&
               grep -Fq 'HAPUS UNTUK SEMUA' /tmp/moshi-app; then
              echo 'MOSHI_STAGING_DEPLOY_AND_HTML_PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'MOSHI_STAGING_SMOKE_FAIL'
          exit 1
