name: AM DIGITAL LAB CRM Cloudflare Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amdl-crm-cloudflare-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amdl-crm-cloudflare-bridge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AM DIGITAL LAB CRM
        uses: actions/checkout@v6
        with:
          repository: ardarawk-cloud/am-digital-lab-crm
          ref: main

      - name: Build and validate CRM Worker
        run: |
          npm run build
          node --check worker.js
          for f in public/*.js; do if [ -f "$f" ]; then node --check "$f"; fi; done

      - name: Deploy CRM to existing Cloudflare account
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy

      - name: Verify CRM health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Deployment URL: ${DEPLOYMENT_URL:-<empty>}"
          [ -n "${DEPLOYMENT_URL:-}" ] || exit 1
          for attempt in 1 2 3 4 5 6; do
            BODY="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/healthz" || true)"
            echo "$BODY"
            if printf '%s' "$BODY" | grep -q '0.3.0-cloudflare'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
