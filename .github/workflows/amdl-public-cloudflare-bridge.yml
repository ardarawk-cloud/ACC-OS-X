name: NADMO STUDIO Public Website Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amdl-public-cloudflare-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amdl-public-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NADMO STUDIO monorepo
        uses: actions/checkout@v6
        with:
          repository: ardarawk-cloud/am-digital-lab-crm
          ref: main

      - name: Generate public personal-brand samples
        run: |
          bash scripts/capture-portfolio.sh

      - name: Validate public website
        run: |
          node --check worker-public.js
          node --check site/app.js
          grep -q 'WE BUILD DIGITAL PRODUCTS' site/index.html
          grep -q 'NADMO STUDIO' site/index.html
          grep -q 'Start a Project' site/index.html
          grep -q 'FEATURED BUSINESSES' site/index.html
          grep -q 'business-slider' site/index.html
          grep -q 'initBusinessSlider' site/app.js
          grep -q 'ROAMINK' site/index.html
          grep -q 'STAYINK' site/index.html
          grep -q 'Bali Wedding DJ' site/index.html
          grep -q 'AM Sound Rental' site/index.html
          grep -q 'Bali Nightlife Connect' site/index.html
          grep -q 'Arakkadabra' site/index.html
          grep -q 'Ayam Ayem' site/index.html
          grep -q 'Original Bali' site/index.html
          grep -q 'ORDER / CHECKOUT' site/checkout.html
          grep -q 'Rp599.000' site/checkout.html
          grep -q 'Rp799.000' site/checkout.html
          grep -q 'Kota Denpasar, Bali, Indonesia' site/checkout.html
          grep -q '+62 822-4797-2288' site/checkout.html
          grep -q '/checkout.html' site/index.html
          node --check site/checkout.js
          grep -q 'PT Perorangan' site/index.html
          grep -q 'PERSONAL BRANDING SAMPLES' site/index.html
          grep -q 'FOR BUSINESS' site/index.html
          grep -q 'Arda Moron' site/index.html
          grep -q 'BBYA' site/index.html
          grep -q 'DWP' site/index.html
          grep -q 'Personal Branding' site/index.html
          grep -q 'Arda Moron' site/index.html
          grep -q 'BBYA' site/index.html
          grep -q 'DWP' site/index.html
          grep -q 'Rp799.000' site/index.html
          grep -q 'Rp599.000' site/index.html
          grep -q 'BUSINESS &amp; LEGAL SETUP' site/index.html
          grep -q 'sendDiscordLeadNotification' worker-public.js
          grep -q 'sendWhatsAppLeadNotification' worker-public.js
          grep -q "const SITE_VERSION='2.0.0'" worker-public.js
          grep -q 'Sitemap:' site/robots.txt
          grep -q '<urlset' site/sitemap.xml
          for f in arda-moron bbya dwp; do
            test -s "site/portfolio/$f.png"
          done

      - name: Deploy public website
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy -c wrangler-public.jsonc

      - name: Verify public website, businesses, checkout and lead bridge
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Deployment URL: ${DEPLOYMENT_URL:-<empty>}"
          [ -n "${DEPLOYMENT_URL:-}" ] || exit 1
          for attempt in 1 2 3 4 5 6; do
            HEALTH="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/healthz" || true)"
            HOME="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/" || true)"
            ROBOTS="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/robots.txt" || true)"
            if grep -q 'am-digital-lab-public' <<<"$HEALTH" && grep -q '"version":"2.0.0"' <<<"$HEALTH" && grep -q '"discord_notification_configured":' <<<"$HEALTH" && grep -q 'WE BUILD DIGITAL PRODUCTS' <<<"$HOME" && grep -q 'FEATURED BUSINESSES' <<<"$HOME" && grep -q 'Sitemap:' <<<"$ROBOTS"; then
              break
            fi
            sleep 5
          done
          echo "Health: $HEALTH"
          grep -q '"ok":true' <<<"$HEALTH"
          grep -q '"version":"2.0.0"' <<<"$HEALTH"
          grep -q '"discord_notification_configured":' <<<"$HEALTH"
          grep -q '"whatsapp_notification_configured":true' <<<"$HEALTH"
          grep -q '"notification_primary":' <<<"$HEALTH"
          grep -q 'NADMO STUDIO' <<<"$HOME"
          grep -q 'BUSINESSES WE RUN' <<<"$HOME"
          grep -q 'Bali Wedding DJ' <<<"$HOME"
          grep -q 'AM Sound Rental' <<<"$HOME"
          grep -q 'STAYINK' <<<"$HOME"
          grep -q 'ROAMINK' <<<"$HOME"
          grep -q 'Sitemap:' <<<"$ROBOTS"
          curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/portfolio/arda-moron.png" -o /tmp/arda-moron.png
          curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/portfolio/bbya.png" -o /tmp/bbya.png
          curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/portfolio/dwp.png" -o /tmp/dwp.png
          CHECKOUT="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/checkout.html")"
          grep -Fq 'ORDER / CHECKOUT' <<<"$CHECKOUT"
          grep -Fq 'Kota Denpasar, Bali, Indonesia' <<<"$CHECKOUT"
          grep -Fq '+62 822-4797-2288' <<<"$CHECKOUT"
          grep -Fq 'Rp599.000' <<<"$CHECKOUT"
          test "$(wc -c < /tmp/arda-moron.png)" -gt 10000
          test "$(wc -c < /tmp/bbya.png)" -gt 10000
          test "$(wc -c < /tmp/dwp.png)" -gt 10000
          CODE="$(curl --silent --show-error --output /tmp/amdl-public-form.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":""}')"
          cat /tmp/amdl-public-form.txt
          echo "Malformed lead bridge status: $CODE"
          [ "$CODE" = "400" ]

      - name: One-time WhatsApp E2E lead test
        if: contains(github.event.head_commit.message, '[wa-e2e-test]')
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          TEST_CODE="$(curl --silent --show-error --output /tmp/amdl-wa-test.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":"AMDL Notification Test","company":"NADMO STUDIO Internal Test","email":"notification-test@example.com","project_type":"WhatsApp Notification Test","budget_range":"TEST ONLY","target_launch":"2026-09-14","project_description":"Automated end-to-end WhatsApp notification test. Safe to archive after verification."}')"
          cat /tmp/amdl-wa-test.txt
          echo "WhatsApp E2E lead status: $TEST_CODE"
          [ "$TEST_CODE" = "201" ]

      - name: One-time Discord E2E lead test
        if: contains(github.event.head_commit.message, '[discord-e2e-test]')
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/healthz")"
          grep -q '"discord_notification_configured":true' <<<"$HEALTH"
          TEST_CODE="$(curl --silent --show-error --output /tmp/amdl-discord-test.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":"AMDL Discord Test","company":"NADMO STUDIO Internal Test","email":"notification-test@example.com","project_type":"Discord Notification Test","budget_range":"TEST ONLY","target_launch":"2026-09-14","project_description":"Automated end-to-end Discord notification test. Safe to archive after verification."}')"
          cat /tmp/amdl-discord-test.txt
          echo "Discord E2E lead status: $TEST_CODE"
          [ "$TEST_CODE" = "201" ]

