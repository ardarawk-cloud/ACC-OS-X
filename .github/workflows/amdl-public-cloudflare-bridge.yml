name: NADMO STUDIO Public Website Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amdl-public-cloudflare-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amdl-public-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout NADMO STUDIO monorepo
        uses: actions/checkout@v6
        with:
          repository: ardarawk-cloud/am-digital-lab-crm
          ref: main

      - name: Generate public personal-brand samples
        run: |
          bash scripts/capture-portfolio.sh

      - name: Validate public website
        run: |
          node --check worker-public.js
          node --check site/app.js
          grep -q 'WE BUILD DIGITAL PRODUCTS' site/index.html
          grep -q 'NADMO STUDIO' site/index.html
          grep -q 'Start a Project' site/index.html
          grep -q 'FEATURED BUSINESSES' site/index.html
          grep -q 'business-roamink.png' site/index.html
          grep -q 'business-stayink.png' site/index.html
          grep -q 'business-bwd.png' site/index.html
          grep -q 'business-amsound.png' site/index.html
          grep -q 'business-balinightlifeconnect.png' site/index.html
          grep -q 'business-originalbali.png' site/index.html
          grep -q 'business-slider' site/index.html
          grep -q 'initBusinessSlider' site/app.js
          grep -q 'ROAMINK' site/index.html
          grep -q 'STAYINK' site/index.html
          grep -q 'Bali Wedding DJ' site/index.html
          grep -q 'https://bookbwd.nadmo.id/' site/index.html
          grep -q 'AM Sound Rental' site/index.html
          grep -q 'https://amsound.nadmo.id/' site/index.html
          grep -q 'Bali Nightlife Connect' site/index.html
          grep -q 'Arakkadabra' site/index.html
          grep -q 'Ayam Ayem' site/index.html
          grep -q 'Original Bali' site/index.html
          grep -q 'ORDER / CHECKOUT' site/checkout.html
          grep -q 'Rp599.000' site/checkout.html
          grep -q 'Rp799.000' site/checkout.html
          grep -q 'Denpasar, Bali, Indonesia' site/checkout.html
          grep -q '+62 822-4797-2288' site/checkout.html
          grep -q '/checkout.html' site/index.html
          node --check site/checkout.js
          grep -q 'PT Perorangan' site/index.html
          grep -q 'PERSONAL BRANDING SAMPLES' site/index.html
          grep -q 'FOR BUSINESS' site/index.html
          grep -q 'BUSINESS WEBSITE PORTFOLIO' site/index.html
          grep -q 'ZUZU Family House' site/index.html
          grep -q 'Brush by Yuda' site/index.html
          grep -q 'Arda Moron' site/index.html
          grep -q 'BBYA' site/index.html
          grep -q 'DWP' site/index.html
          grep -q 'SAIXKO' site/index.html
          grep -q 'https://saixko.nadmo.id/' site/index.html
          grep -q 'Berlin Bintang' site/index.html
          grep -q 'https://berlinbintang.nadmo.id/' site/index.html
          grep -q 'DJ Keyrin' site/index.html
          grep -q 'https://djkeyrin.nadmo.id/' site/index.html
          grep -q 'Oka Raditya' site/index.html
          grep -q 'https://okaraditya.nadmo.id/' site/index.html
          grep -q 'Anya Kaizy' site/index.html
          grep -q 'https://anyakaizy.nadmo.id/' site/index.html
          grep -q 'Dekhan Good' site/index.html
          grep -q 'https://dekhangood.nadmo.id/' site/index.html
          grep -q 'Personal Branding' site/index.html
          grep -q 'Arda Moron' site/index.html
          grep -q 'BBYA' site/index.html
          grep -q 'DWP' site/index.html
          grep -q 'Rp799.000' site/index.html
          grep -q 'Rp599.000' site/index.html
          grep -q 'BUSINESS &amp; LEGAL SETUP' site/index.html
          grep -q 'sendDiscordLeadNotification' worker-public.js
          grep -q 'sendWhatsAppLeadNotification' worker-public.js
          grep -q "const SITE_VERSION='2.0.0'" worker-public.js
          grep -q 'Sitemap:' site/robots.txt
          grep -q '<urlset' site/sitemap.xml
          for f in arda-moron bbya dwp saixko berlin-bintang dj-keyrin oka-raditya anya-kaizy dekhan-good business-roamink business-stayink business-bwd business-amsound business-balinightlifeconnect business-originalbali work-zuzu work-brush-by-yuda; do
            test -s "site/portfolio/$f.png"
          done

      - name: Deploy public website
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          command: deploy -c wrangler-public.jsonc

      - name: Verify public website, businesses, checkout and lead bridge
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Deployment URL: ${DEPLOYMENT_URL:-<empty>}"
          [ -n "${DEPLOYMENT_URL:-}" ] || { echo "FAIL: missing deployment URL"; exit 1; }

          require_text() {
            local label="$1"
            local haystack="$2"
            local needle="$3"
            if [[ "$haystack" == *"$needle"* ]]; then
              echo "PASS: $label"
            else
              echo "FAIL: $label — missing: $needle"
              exit 1
            fi
          }

          for attempt in 1 2 3 4 5 6; do
            HEALTH="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/healthz" || true)"
            HOME="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/" || true)"
            ROBOTS="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/robots.txt" || true)"
            if [[ "$HEALTH" == *'"ok":true'* ]] && [[ "$HOME" == *'SAIXKO'* ]] && [[ "$HOME" == *'https://saixko.nadmo.id/'* ]] && [[ "$HOME" == *'Berlin Bintang'* ]] && [[ "$HOME" == *'https://berlinbintang.nadmo.id/'* ]] && [[ "$HOME" == *'DJ Keyrin'* ]] && [[ "$HOME" == *'https://djkeyrin.nadmo.id/'* ]] && [[ "$HOME" == *'Oka Raditya'* ]] && [[ "$HOME" == *'https://okaraditya.nadmo.id/'* ]] && [[ "$HOME" == *'oka-raditya-shot'* ]] && [[ "$HOME" == *'Anya Kaizy'* ]] && [[ "$HOME" == *'https://anyakaizy.nadmo.id/'* ]] && [[ "$HOME" == *'Dekhan Good'* ]] && [[ "$HOME" == *'https://dekhangood.nadmo.id/'* ]] && [[ "$HOME" == *'BUSINESS WEBSITE PORTFOLIO'* ]] && [[ "$HOME" == *'business-roamink.png'* ]] && [[ "$HOME" == *'business-stayink.png'* ]] && [[ "$HOME" == *'business-bwd.png'* ]] && [[ "$HOME" == *'business-amsound.png'* ]] && [[ "$HOME" == *'business-balinightlifeconnect.png'* ]] && [[ "$HOME" == *'business-originalbali.png'* ]] && [[ "$ROBOTS" == *'Sitemap:'* ]]; then
              break
            fi
            sleep 5
          done

          require_text "health service" "$HEALTH" "am-digital-lab-public"
          require_text "health ok" "$HEALTH" '"ok":true'
          require_text "health version" "$HEALTH" '"version":"2.0.0"'
          require_text "WhatsApp notification config" "$HEALTH" '"whatsapp_notification_configured":true'
          require_text "notification primary field" "$HEALTH" '"notification_primary":'

          require_text "homepage brand" "$HOME" "NADMO STUDIO"
          require_text "business samples" "$HOME" "BUSINESS WEBSITE PORTFOLIO"
          require_text "ZUZU business sample" "$HOME" "ZUZU Family House"
          require_text "Brush business sample" "$HOME" "Brush by Yuda"
          require_text "featured businesses" "$HOME" "FEATURED BUSINESSES"
          require_text "ROAMINK preview image" "$HOME" "business-roamink.png"
          require_text "STAYINK preview image" "$HOME" "business-stayink.png"
          require_text "BWD preview image" "$HOME" "business-bwd.png"
          require_text "AM Sound preview image" "$HOME" "business-amsound.png"
          require_text "Bali Nightlife Connect preview image" "$HOME" "business-balinightlifeconnect.png"
          require_text "Original Bali preview image" "$HOME" "business-originalbali.png"
          require_text "Bali Wedding DJ" "$HOME" "Bali Wedding DJ"
          require_text "AM Sound Rental" "$HOME" "AM Sound Rental"
          require_text "STAYINK" "$HOME" "STAYINK"
          require_text "ROAMINK" "$HOME" "ROAMINK"
          require_text "SAIXKO portfolio title" "$HOME" "SAIXKO"
          require_text "SAIXKO portfolio link" "$HOME" "https://saixko.nadmo.id/"
          require_text "Berlin Bintang portfolio title" "$HOME" "Berlin Bintang"
          require_text "Berlin Bintang portfolio link" "$HOME" "https://berlinbintang.nadmo.id/"
          require_text "DJ Keyrin portfolio title" "$HOME" "DJ Keyrin"
          require_text "DJ Keyrin portfolio link" "$HOME" "https://djkeyrin.nadmo.id/"
          require_text "Oka Raditya portfolio title" "$HOME" "Oka Raditya"
          require_text "Oka Raditya portfolio link" "$HOME" "https://okaraditya.nadmo.id/"
          require_text "Oka Raditya preview framing" "$HOME" "oka-raditya-shot"
          require_text "Anya Kaizy portfolio title" "$HOME" "Anya Kaizy"
          require_text "Anya Kaizy portfolio link" "$HOME" "https://anyakaizy.nadmo.id/"
          require_text "Dekhan Good portfolio title" "$HOME" "Dekhan Good"
          require_text "Dekhan Good portfolio link" "$HOME" "https://dekhangood.nadmo.id/"
          require_text "robots sitemap" "$ROBOTS" "Sitemap:"

          CHECKOUT="$(curl --fail --location --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/checkout.html")"
          require_text "checkout title" "$CHECKOUT" "ORDER / CHECKOUT"
          require_text "checkout domicile" "$CHECKOUT" "Denpasar, Bali, Indonesia"
          require_text "checkout contact" "$CHECKOUT" "+62 822-4797-2288"
          require_text "checkout PT price" "$CHECKOUT" "Rp599.000"

          for asset in arda-moron bbya dwp saixko berlin-bintang dj-keyrin oka-raditya anya-kaizy dekhan-good business-roamink business-stayink business-bwd business-amsound business-balinightlifeconnect business-originalbali work-zuzu work-brush-by-yuda; do
            curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/portfolio/$asset.png" -o "/tmp/$asset.png"
            SIZE="$(wc -c < "/tmp/$asset.png")"
            echo "Asset $asset.png: $SIZE bytes"
            [ "$SIZE" -gt 10000 ] || { echo "FAIL: $asset.png too small"; exit 1; }
          done

          CODE="$(curl --silent --show-error --output /tmp/amdl-public-form.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":""}')"
          cat /tmp/amdl-public-form.txt
          echo "Malformed lead bridge status: $CODE"
          [ "$CODE" = "400" ] || { echo "FAIL: malformed lead request expected HTTP 400"; exit 1; }

          for asset in arda-moron bbya dwp saixko berlin-bintang dj-keyrin oka-raditya anya-kaizy dekhan-good business-roamink business-stayink business-bwd business-amsound business-balinightlifeconnect business-originalbali; do
            URL="https://nadmo.id/portfolio/$asset.png?v=20261005"
            CODE="$(curl --location --silent --show-error --output "/tmp/custom-$asset.png" --write-out '%{http_code}' --max-time 30 "$URL")"
            TYPE="$(curl --location --silent --show-error --head --max-time 30 "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print tolower($2); exit}')"
            SIZE="$(wc -c < "/tmp/custom-$asset.png")"
            echo "Custom domain asset $asset: HTTP $CODE, type=$TYPE, bytes=$SIZE"
            [ "$CODE" = "200" ] || { echo "FAIL: custom-domain $asset HTTP $CODE"; exit 1; }
            [[ "$TYPE" == image/* ]] || { echo "FAIL: custom-domain $asset content-type $TYPE"; exit 1; }
            [ "$SIZE" -gt 10000 ] || { echo "FAIL: custom-domain $asset too small"; exit 1; }
          done

          echo "Production verification PASS"

      - name: One-time WhatsApp E2E lead test
        if: contains(github.event.head_commit.message, '[wa-e2e-test]')
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          TEST_CODE="$(curl --silent --show-error --output /tmp/amdl-wa-test.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":"AMDL Notification Test","company":"NADMO STUDIO Internal Test","email":"notification-test@example.com","project_type":"WhatsApp Notification Test","budget_range":"TEST ONLY","target_launch":"2026-09-14","project_description":"Automated end-to-end WhatsApp notification test. Safe to archive after verification."}')"
          cat /tmp/amdl-wa-test.txt
          echo "WhatsApp E2E lead status: $TEST_CODE"
          [ "$TEST_CODE" = "201" ]

      - name: One-time Discord E2E lead test
        if: contains(github.event.head_commit.message, '[discord-e2e-test]')
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 30 "${DEPLOYMENT_URL%/}/healthz")"
          grep -q '"discord_notification_configured":true' <<<"$HEALTH"
          TEST_CODE="$(curl --silent --show-error --output /tmp/amdl-discord-test.txt --write-out '%{http_code}' --max-time 30 -X POST "${DEPLOYMENT_URL%/}/api/start-project" -H 'content-type: application/json' --data '{"name":"AMDL Discord Test","company":"NADMO STUDIO Internal Test","email":"notification-test@example.com","project_type":"Discord Notification Test","budget_range":"TEST ONLY","target_launch":"2026-09-14","project_description":"Automated end-to-end Discord notification test. Safe to archive after verification."}')"
          cat /tmp/amdl-discord-test.txt
          echo "Discord E2E lead status: $TEST_CODE"
          [ "$TEST_CODE" = "201" ]

