name: ROAMINK Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/roamink/**'
      - '.github/workflows/roamink-cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roamink-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install and build exact ROAMINK frontend
        working-directory: apps/roamink
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          for file in index.html contact.html legal.html faq.html plans.html logo.svg; do
            test -s "dist/$file"
          done
          grep -q 'ROAMINK' dist/index.html
          grep -q 'Travel eSIM Plans & Pricing' dist/plans.html
          grep -q 'Frequently Asked Questions' dist/faq.html
          grep -q 'Refund Policy' dist/legal.html
          grep -q 'PT NADMO STUDIO INDONESIA' dist/contact.html
          if grep -RniE 'preview catalog|sandbox payment|Commercial sales remain disabled' dist; then
            echo "::error::ROAMINK production build still contains preview/sandbox copy."
            exit 1
          fi

      - name: Deploy ROAMINK Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: 'apps/roamink'
          command: deploy -c wrangler.jsonc

      - name: Restore iPaymu secrets when available
        working-directory: apps/roamink
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IPAYMU_API_KEY: ${{ secrets.ROAMINK_IPAYMU_API_KEY || secrets.IPAYMU_API_KEY }}
          IPAYMU_VA: ${{ secrets.ROAMINK_IPAYMU_VA || secrets.IPAYMU_VA }}
          DIGIFLAZZ_USERNAME: ${{ secrets.ROAMINK_DIGIFLAZZ_USERNAME || secrets.DIGIFLAZZ_USERNAME }}
          DIGIFLAZZ_API_KEY: ${{ secrets.ROAMINK_DIGIFLAZZ_API_KEY || secrets.DIGIFLAZZ_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${IPAYMU_API_KEY:-}" ]; then
            printf '%s' "$IPAYMU_API_KEY" | npx wrangler@4.115.0 secret put IPAYMU_API_KEY -c wrangler.jsonc
          else
            echo "::warning::ROAMINK IPAYMU_API_KEY is not configured in GitHub secrets."
          fi
          if [ -n "${IPAYMU_VA:-}" ]; then
            printf '%s' "$IPAYMU_VA" | npx wrangler@4.115.0 secret put IPAYMU_VA -c wrangler.jsonc
          else
            echo "::warning::ROAMINK IPAYMU_VA is not configured in GitHub secrets."
          fi
          if [ -n "${DIGIFLAZZ_USERNAME:-}" ]; then
            printf '%s' "$DIGIFLAZZ_USERNAME" | npx wrangler@4.115.0 secret put DIGIFLAZZ_USERNAME -c wrangler.jsonc
          else
            echo "::warning::ROAMINK DIGIFLAZZ_USERNAME is not configured in GitHub secrets."
          fi
          if [ -n "${DIGIFLAZZ_API_KEY:-}" ]; then
            printf '%s' "$DIGIFLAZZ_API_KEY" | npx wrangler@4.115.0 secret put DIGIFLAZZ_API_KEY -c wrangler.jsonc
          else
            echo "::warning::ROAMINK DIGIFLAZZ_API_KEY is not configured in GitHub secrets."
          fi

      - name: Verify Cloudflare deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [ -n "${DEPLOYMENT_URL:-}" ]
          BASE="${DEPLOYMENT_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            HEALTH="$(curl --fail --silent --show-error --max-time 30 "$BASE/api/_healthcheck" || true)"
            HOME="$(curl --fail --silent --show-error --max-time 30 "$BASE/" || true)"
            if printf '%s' "$HEALTH" | grep -q '"service":"roamink"' && printf '%s' "$HOME" | grep -q 'ROAMINK'; then
              echo "ROAMINK Worker verified on attempt $attempt"
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep 5
          done

      - name: Bind roamink.nadmo.id Worker route
        id: domain
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.115.0'
          workingDirectory: 'apps/roamink'
          command: deploy -c wrangler-domain.jsonc

      - name: Verify public merchant website
        run: |
          set -euo pipefail
          BASE="https://roamink.nadmo.id"
          for attempt in $(seq 1 12); do
            ok=1
            for path in / /plans.html /legal.html /faq.html /contact.html; do
              code="$(curl --silent --show-error --location --output "/tmp/roamink$(echo "$path" | tr '/.' '__').html" --write-out '%{http_code}' --max-time 30 "$BASE$path" || true)"
              echo "$path -> HTTP $code"
              [ "$code" = "200" ] || ok=0
            done
            if [ "$ok" = "1" ]               && grep -q 'ROAMINK' /tmp/roamink_.html               && grep -q 'Live travel eSIM inventory' /tmp/roamink_plans_html.html               && grep -q 'Refund Policy' /tmp/roamink_legal_html.html               && grep -q 'Frequently Asked Questions' /tmp/roamink_faq_html.html               && grep -q 'PT NADMO STUDIO INDONESIA' /tmp/roamink_contact_html.html; then
              if grep -RniE 'preview catalog|sandbox payment|Commercial sales remain disabled' /tmp/roamink*.html; then
                echo "::error::Public ROAMINK site still exposes preview/sandbox wording."
                exit 1
              fi
              echo "ROAMINK public merchant website verified."
              exit 0
            fi
            sleep 5
          done
          exit 1


      - name: Verify payment relay from Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            RELAY="$(curl --silent --show-error --fail --max-time 30 https://roamink.nadmo.id/api/payment-relay-check || true)"
            echo "$RELAY"
            if [ -n "$RELAY" ] && jq -e '.ok == true and .relay.service == "roamink-payment-relay" and .egress.outbound_ipv4 == "151.243.222.93"' <<<"$RELAY" >/dev/null 2>&1; then
              echo "ROAMINK payment relay verified through Cloudflare Worker."
              exit 0
            fi
            sleep 5
          done
          echo "::error::ROAMINK payment relay verification failed."
          exit 1


      - name: Verify production iPaymu credentials
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            CHECK="$(curl --silent --show-error --fail --max-time 30 https://roamink.nadmo.id/api/payment-credential-check || true)"
            echo "$CHECK"
            if [ -n "$CHECK" ] && jq -e '.ok == true and .diagnosis == "PRODUCTION_CREDENTIAL" and .production.authenticated == true' <<<"$CHECK" >/dev/null 2>&1; then
              echo "ROAMINK production iPaymu credentials verified through VPS relay."
              exit 0
            fi
            sleep 5
          done
          echo "::error::ROAMINK production iPaymu credentials were not accepted."
          exit 1


      - name: Verify Digiflazz eSIM supplier when configured
        shell: bash
        run: |
          set -euo pipefail
          CONFIG="$(curl --silent --show-error --fail --max-time 30 https://roamink.nadmo.id/api/config)"
          echo "$CONFIG"
          if jq -e '.supplier_configured == true' <<<"$CONFIG" >/dev/null 2>&1; then
            CHECK="$(curl --silent --show-error --fail --max-time 45 https://roamink.nadmo.id/api/supplier-credential-check)"
            echo "$CHECK"
            jq -e '.ok == true and .supplier == "digiflazz" and .active_products > 0 and .destinations > 0' <<<"$CHECK" >/dev/null
            echo "ROAMINK Digiflazz eSIM supplier verified."
          else
            echo "::warning::Digiflazz supplier secrets are not configured yet; ROAMINK remains on the safe fallback catalog."
          fi
