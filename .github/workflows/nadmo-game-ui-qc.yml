name: NADMO GAME modern mobile UI QC
on:
  push:
    branches: ['feat/nadmo-live-game-modern-ui-20261010']
    paths:
      - 'nadmo-live-beta/**'
      - '.github/workflows/nadmo-game-ui-qc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check nadmo-live-beta/worker.mjs
      - run: npm install --prefix nadmo-live-beta/qa --no-save --no-audit --no-fund puppeteer-core@24
      - run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - run: node nadmo-live-beta/qa/game-ui-integration.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nadmo-game-modern-mobile-preview
          path: nadmo-live-beta/qa/nadmo-game-mobile-qc.png
          if-no-files-found: ignore
