<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.wrap{position:fixed;inset:0;display:grid;place-items:start center;pointer-events:none}.alert{margin-top:70px;min-width:360px;max-width:900px;padding:20px 26px;border-radius:18px;background:rgba(8,12,10,.88);border:2px solid rgba(220,255,56,.95);box-shadow:0 14px 48px rgba(0,0,0,.45);color:#fff;text-align:center;opacity:0;transform:translateY(-22px) scale(.97);transition:.28s ease}.alert.show{opacity:1;transform:translateY(0) scale(1)}.donor{font-size:34px;font-weight:900}.amount{font-size:26px;font-weight:800;color:#dcff38;margin-top:5px}.message{font-size:22px;margin-top:10px;line-height:1.35;white-space:pre-wrap}.brand{font-size:12px;letter-spacing:.18em;margin-top:12px;color:#aeb7ae}@media(max-width:700px){.alert{min-width:0;width:88vw}.donor{font-size:26px}.amount{font-size:22px}.message{font-size:18px}}</style></head><body><div class="wrap"><div id="alert" class="alert"><div id="donor" class="donor"></div><div id="amount" class="amount"></div><div id="message" class="message"></div><div class="brand">NADMO LIVE • SUPPORT ALERT</div></div></div><script>
const q=new URLSearchParams(location.search),token=q.get('token')||'',tts=q.get('tts')==='1';let last='',first=true,timer=null;
const rupiah=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Number(n)||0);
async function poll(){if(!token)return;try{const r=await fetch('/api/integrations/overlay/'+encodeURIComponent(token)+(last?'?after='+encodeURIComponent(last):''),{cache:'no-store'});const d=await r.json();if(d?.event){if(first){last=d.event.id;first=false;return}show(d.event)}else first=false}catch{}}
function speak(e){if(!tts||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const text=e.donor+' mendukung '+rupiah(e.amountRaw)+(e.message?'. '+e.message:'');const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';speechSynthesis.speak(u)}catch{}}
function show(e){last=e.id;document.getElementById('donor').textContent=e.donor||'Anonim';document.getElementById('amount').textContent=rupiah(e.amountRaw);document.getElementById('message').textContent=e.message||'Terima kasih atas dukungannya!';const box=document.getElementById('alert');box.classList.add('show');speak(e);clearTimeout(timer);timer=setTimeout(()=>box.classList.remove('show'),8000)}
setInterval(poll,1200);poll();</script></body></html>
