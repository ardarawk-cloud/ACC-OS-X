apply plugin: 'com.android.application'

android {
    namespace 'com.ardacore.accosx'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ardacore.accosx'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-pilot'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
